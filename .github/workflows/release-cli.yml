name: release-cli

# Publishes @angelmcp/cli through npm trusted publishing. The job holds no npm
# token: npm mints a short-lived credential from this workflow's OIDC identity,
# which is also what stamps the provenance attestation.
#
# Publication happens on a cli-v* tag and nowhere else. workflow_dispatch packs
# and proves without publishing, so no manual run can put a package on the
# registry from an arbitrary ref.
#
# The first publication of a new package cannot use trusted publishing, because
# npm attaches a trusted publisher to a package that already exists. Create the
# package once with a scoped token, add this workflow as its trusted publisher,
# then every release runs from here.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The same proof that gates every PR, run again against the exact commit
      # being released.
      - run: pnpm run check:ws2cli

      # check:ws2cli builds dist/ as a side effect. Build it explicitly so a
      # future edit to the proof cannot publish a package whose bin points at a
      # file the tarball does not contain — a version number is never reusable.
      - name: Build and verify the publishable bundle
        run: |
          pnpm --dir packages/cli run build
          test -x packages/cli/dist/angel.js
          test -s packages/cli/dist/THIRD-PARTY-NOTICES.txt

      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          manifest="$(node -p "require('./packages/cli/package.json').version")"
          tagged="${GITHUB_REF_NAME#cli-v}"
          if [ "$manifest" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $manifest" >&2
            exit 1
          fi

      # Only a cli-v* tag publishes. A dispatch run stops here, having proved
      # the package without touching the registry.
      - name: Publish with provenance
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: npm publish --provenance --access public
        working-directory: packages/cli

      - name: Record the published tarball
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: npm view @angelmcp/cli@"$(node -p "require('./packages/cli/package.json').version")" dist.integrity dist.attestations --json

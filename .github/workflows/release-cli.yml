name: release-cli

# Publishes @angelmcp/cli through npm trusted publishing. The job holds no npm
# token: npm mints a short-lived credential from this workflow's OIDC identity,
# which is also what stamps the provenance attestation.
#
# The first publication of a new package cannot use trusted publishing, because
# npm attaches a trusted publisher to an existing package. Publish 0.1.0 once
# with a scoped token, add this workflow as the trusted publisher on the package
# settings page, then every later release runs from here.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and prove without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The same proof that gates every PR, run again against the exact commit
      # being published.
      - run: pnpm run check:ws2cli

      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          manifest="$(node -p "require('./packages/cli/package.json').version")"
          tagged="${GITHUB_REF_NAME#cli-v}"
          if [ "$manifest" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $manifest" >&2
            exit 1
          fi

      - name: Publish with provenance
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --provenance --access public
        working-directory: packages/cli

      - name: Record the published tarball
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm view @angelmcp/cli@"$(node -p "require('./packages/cli/package.json').version")" dist.integrity dist.attestations --json

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Cloud — Product Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz@1,6..72&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Product Ledger — Card skin. Zero-dependency static CSS.
   Pairs with components/render.js. Fonts load from Google (graceful fallback to
   system fonts); everything else is self-contained. */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#e7e9ec;color:#1b1e22;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}

/* generic collapse (measured height) */
.det{height:0;overflow:hidden;transition:height .28s cubic-bezier(.4,0,.2,1)}
.det>.det-in{overflow:hidden}

.brow{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.brow .kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase}

/* voice toggle */
.ctlbar{display:flex;justify-content:space-between;align-items:center;gap:.7rem 1.4rem;flex-wrap:wrap;margin-bottom:.35rem}
.aud{display:inline-flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.audlabel{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-right:.1rem}
.audbtn{font-family:inherit;font-size:.68rem;letter-spacing:.02em;padding:.2rem .55rem;border-radius:999px;border:1px solid rgba(125,125,125,.32);background:transparent;color:inherit;opacity:.5;cursor:pointer;transition:opacity .15s,border-color .15s,background .15s}
.audbtn:hover{opacity:.85}
.audbtn.on{opacity:1;border-color:currentColor;color:#1c6b58;background:#fff;border-color:#bcd9cf}
.vtext{transition:opacity .12s}
.vtext.vabsent{opacity:.62;font-style:italic}

/* ---------- Card skin ---------- */
.v-card{background:#e7e9ec;color:#1b1e22}
.inner{max-width:60rem;margin:0 auto;padding:clamp(2.2rem,5vw,3.6rem) clamp(1.1rem,4vw,2.4rem) 5rem}
.v-card .kicker{color:#2b6a58}
.v-card .folio{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:#8a9097}
.v-card h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(2.2rem,6vw,3.1rem);line-height:1;letter-spacing:-.015em;margin:1.3rem 0 .2rem}
.v-card .sub{font-size:.95rem;color:#63696f;margin:0 0 1.6rem}
.v-card .ctl{display:flex;align-items:center;gap:.5rem;margin:0 0 1.1rem}
.v-card .ctlbtn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.05em;color:#5c626a;background:none;border:0;cursor:pointer;padding:.25rem .1rem}
.v-card .ctlbtn:hover{color:#1b1e22;text-decoration:underline}
.v-card .sep{color:#b9bfc6}

/* epic = outer container */
.v-card .ecard{background:#f4f5f7;border:1px solid #dde1e6;border-radius:18px;padding:.5rem;margin:0 0 1.15rem;box-shadow:0 1px 1px rgba(20,24,28,.03)}
.v-card .ehead{display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem .8rem;cursor:pointer;border-radius:14px}
.v-card .ehead:hover{background:#eceef1}
.v-card .ebadge{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;font-weight:500;color:#1b1e22;background:#e3e6ea;border-radius:6px;padding:.2rem .45rem;flex:none}
.v-card .etitle{font-family:"Fraunces",Georgia,serif;font-size:1.42rem;font-weight:500;line-height:1.1;color:#1b1e22}
.v-card .etitle .ver{color:#8a9097;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.9rem;font-weight:400;margin-right:.15rem}
.v-card .grow{flex:1}
.v-card .caret{flex:none;width:.75rem;font-size:.62rem;color:#aab0b7;transition:transform .25s;align-self:center}
.v-card .ehead.open .caret,.v-card .chead.open .caret,.v-card .fitem.open .caret,.v-card .gfoot.open .caret{transform:rotate(90deg)}

/* status pill */
.v-card .pill{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.04em;font-weight:500;border-radius:999px;padding:.22rem .6rem;flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.v-card .pill .pip{width:6px;height:6px;border-radius:50%;flex:none}

/* commitment = white card */
.v-card .ccard{background:#fff;border:1px solid #e9ebef;border-radius:12px;margin:.3rem .3rem;box-shadow:0 1px 2px rgba(20,24,28,.05)}
.v-card .chead{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;cursor:pointer;border-radius:12px}
.v-card .chead:hover{background:#f8f9fb}
.v-card .cid{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;color:#969ca3;flex:none}
.v-card .ctitle{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;font-weight:500;line-height:1.2;color:#1b1e22}
.v-card .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid #d5d9de;border-radius:3px;padding:.1rem .36rem;color:#8a9097;flex:none;align-self:center}
.v-card .tag.ent{color:#2b6a58;border-color:#bcd9cf}
.v-card .tag.amd{color:#9a7d1a;border-color:#e0d3a6}

/* commitment law detail */
.v-card .claw{padding:.1rem .95rem .3rem;border-top:1px solid #f0f1f4}
.v-card .dsc{font-size:.92rem;line-height:1.55;color:#3c4147;margin:.6rem 0 .55rem;max-width:42rem}
.v-card dl{display:grid;grid-template-columns:auto 1fr;gap:.26rem 1.1rem;margin:0 0 .5rem;font-size:.84rem;max-width:44rem}
.v-card dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:#a08a3c;padding-top:.16rem}
.v-card dd{margin:0;color:#4a4f56;line-height:1.5}

/* checklist of features */
.v-card .checklist{padding:.15rem .3rem .5rem;border-top:1px solid #f0f1f4;margin-top:.1rem}
.v-card .fitem{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;cursor:pointer;border-radius:8px}
.v-card .fitem:hover{background:#f6f7f9}
.v-card .cbx{flex:none;width:17px;height:17px}
.v-card .fid{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.64rem;color:#a7adb4;flex:none;width:2.4rem}
.v-card .ftitle{font-size:.9rem;color:#33383e}
.v-card .fitem.done .ftitle{color:#7f858c}
.v-card .fstat{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.6rem;letter-spacing:.03em;flex:none}
.v-card .fdet .det-in{padding:.1rem 0 .55rem 3.6rem}
.v-card .fdet .scope{border-left:2px solid #e6e8ec;padding-left:.9rem}
.v-card .scope .dsc{font-size:.86rem;margin:.2rem 0 .4rem}
.v-card .scope dl{font-size:.8rem}

/* unattached work */
.v-card .loose{margin:.15rem .6rem .3rem;padding:.25rem .3rem}
.v-card .loose .llabel{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:#a08a3c;padding:.1rem .3rem .2rem}

/* gate = footer / finish line */
.v-card .gate{margin:.35rem .3rem .1rem;border-top:1.5px dashed #cdd2d8;position:relative}
.v-card .gate::before,.v-card .gate::after{content:"";position:absolute;top:-7px;width:13px;height:13px;border-radius:50%;background:#e7e9ec}
.v-card .gate::before{left:-7px}.v-card .gate::after{right:-7px}
.v-card .gfoot{display:flex;align-items:center;gap:.7rem;padding:.7rem .65rem .55rem;cursor:pointer}
.v-card .gfoot:hover{background:#eceef1;border-radius:9px}
.v-card .gid{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;letter-spacing:.03em;flex:none}
.v-card .gproof{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:.98rem;color:#5c626a}
.v-card .gflag{flex:none;font-size:.8rem}
.v-card .gdet .det-in{padding:.1rem .65rem .7rem 2.6rem}

/* tones */
.v-card .t-green{color:#1c6b58}.v-card .t-green .pip{background:#1c6b58}.v-card .pill.t-green{background:#e4efe9}
.v-card .t-blue{color:#2b5fa8}.v-card .t-blue .pip{background:#2b5fa8}.v-card .pill.t-blue{background:#e5edf7}
.v-card .t-amber{color:#9a7d1a}.v-card .t-amber .pip{background:#9a7d1a}.v-card .pill.t-amber{background:#f3edda}
.v-card .t-grey{color:#828890}.v-card .t-grey .pip{background:#b3b8bf}.v-card .pill.t-grey{background:#eceef1}

/* Keyboard operability: every expandable row is reachable and its focus visible.
   :focus-visible only, so a mouse click does not leave a ring behind. */
.v-card [data-x]:focus-visible{outline:2px solid #2b5fa8;outline-offset:2px;border-radius:8px}
.v-card .audbtn:focus-visible,.v-card .ctlbtn:focus-visible{outline:2px solid #2b5fa8;outline-offset:2px}

</style>
</head>
<body>
<div id="ledger-root"></div>
<script id="ledger" type="application/json">
{
  "$schema": "ledger-roadmap/v0",
  "product": "Angel Cloud",
  "$notes": {
    "authoring": "Epic, commitment and work IDs are carried over unchanged from the hand-built Ledger this file replaces (docs/product-ledger.html before 2026-08-05). They are cited by issues, ADRs and evidence records, so they are identity and never change.",
    "evidenceClasses": "Every description states its own class in prose, because ledger-roadmap/v0 has no field for it. 'Proved on <date> by <artifact>' is current evidence. 'Target' or 'claims at' is target intent. 'Proposed' is unapproved work. 'Unresolved' names an open question. Nothing is asserted on the strength of a document that was describing a wish: the APRD is target intent and is unapproved for implementation.",
    "truthState": "The retired contract carried a truth state (LIVE / PARTIAL / BROKEN / NOT BUILT) separate from plan status. v0 has one status field. Commitment status here reads as truth (live / in-progress / planned); work status reads as plan (done / in-progress / pending / planned). BROKEN and BLOCKED have no token and are stated in prose. Filed as toolkit gaps.",
    "notRendered": "terms[] is authored and validated but v0 never draws it.",
    "sourceOfTruth": "docs/product-ledger.html is generated from this file by ~/Projects/product-ledger/bin/ledger-render. Never hand-edit the HTML."
  },
  "terms": [
    {
      "term": "Account",
      "entity": "One paying identity's tenancy. Owns handles, Angels, Connections and custody state.",
      "shape": "acct_* opaque id, one handle at a time, at most two handles ever",
      "seam": true
    },
    {
      "term": "Angel",
      "entity": "A published toolbox an agent calls over MCP. Never an actor: it has no loop, intent, scheduler or mailbox.",
      "shape": "@handle/angel coordinate"
    },
    {
      "term": "Charter and policy",
      "entity": "The portable, readable part of an Angel: what it may do and under what guards.",
      "shape": "ANGEL.yaml",
      "seam": true
    },
    {
      "term": "Deployment",
      "entity": "Where an Angel runs. Deliberately separate from policy so the same policy redeploys elsewhere.",
      "shape": "angel.json",
      "seam": true
    },
    {
      "term": "Connection",
      "entity": "A bound provider credential held by the Broker on an Account's behalf. Chosen by opaque selector, never by provider identity.",
      "seam": true
    },
    {
      "term": "Version",
      "entity": "One immutable compiled bundle. Promotion moves exact bytes and never rebuilds.",
      "shape": "bundle digest + engine pin"
    },
    {
      "term": "Angel key",
      "entity": "The credential an agent presents to call an Angel. Shown once, recoverable only by rotation."
    },
    {
      "term": "Gate receipt",
      "entity": "The record of what the Gateway and Broker each decided about one call."
    },
    {
      "term": "Handle",
      "entity": "An Account's public name. Unique platform-wide, never released, renameable once.",
      "seam": true
    },
    {
      "term": "Gate",
      "entity": "In this Ledger, the owner's advance/repair/accept decision that closes an epic. Distinct from the Gateway and Broker gates, which are runtime authority checks."
    }
  ],
  "releases": [
    {
      "id": "M0",
      "version": "0.1",
      "status": "shipped",
      "outcome": "A portable Angel runs from a file the owner can read. Charter and policy live in ANGEL.yaml, the client compiles the immutable bytes, and no server ever receives the owner's source or secrets.",
      "voices": {
        "engineer": {
          "title": "Client-side compile, portable policy file",
          "description": "ANGEL.yaml carries charter and policy only. The compiler runs on the client and emits canonical immutable bytes with an engine pin; no server-side build path exists. Deployment identity lives in a separate angel.json."
        },
        "designer": {
          "title": "You can read the thing you are approving",
          "description": "One file describes what the Angel may do, in a form a person reads before approving it. Nothing about where it runs, which account owns it, or which credential it uses appears in that file."
        },
        "marketing": {
          "title": "Your policy, your machine, your bytes",
          "description": "The rules your Angel follows are a file you own and can move. Your source never leaves your machine to be built by anyone else."
        },
        "product": {
          "title": "Review before trust",
          "description": "The job is approving an automation without reading code. A short readable policy file is what makes approval possible, and keeping deployment out of it is what makes the same approved policy reusable."
        },
        "llm": {
          "title": "Policy and deployment never merge",
          "description": "Invariant: ANGEL.yaml holds charter and policy; angel.json holds target. Do not add target, Account, Connection or credential fields to ANGEL.yaml. Do not add a server-side build path."
        }
      },
      "commitments": [
        {
          "id": "G02",
          "title": "Policy stays portable and readable",
          "class": "entrenched",
          "status": "live",
          "description": "ANGEL.yaml contains charter and policy, never target, Account, Connection, or credential identity. Current evidence: proved from repository evidence on 2026-07-31 and governed by ADR 0001.",
          "eval": "Read an ANGEL.yaml end to end: it names no target, Account, Connection or credential. The same file redeploys against a different deployment without an edit.",
          "limit": "Private deployment choices stay in separate config and custody state. The file does not say where an Angel runs, and portability of the file is not portability of the hosting.",
          "voices": {
            "engineer": {
              "title": "ANGEL.yaml holds no deployment identity",
              "description": "The policy schema admits charter and guard fields only. Target, Account, Connection and credential identity are parsed from angel.json and custody state, on a separate path. ADR 0001 is the design of record."
            },
            "designer": {
              "title": "One file, and it is about behavior",
              "description": "The file a person opens to approve an Angel describes what it may do. It contains no address, no account name, and nothing secret, so it can be read aloud or pasted into a review."
            },
            "marketing": {
              "title": "Take your policy with you",
              "description": "The rules are yours in a portable file. Move hosts and the same approved file still describes the same Angel."
            },
            "product": {
              "title": "Approval that survives a move",
              "description": "Owners approve behavior, not infrastructure. Separating the two means a hosting change does not invalidate an approval, which is what keeps review cheap enough to happen at all."
            },
            "llm": {
              "title": "Seam: policy | deployment",
              "description": "Invariant: no target, Account, Connection or credential in ANGEL.yaml. This is the seam that makes redeploy safe. Do not resolve deployment identity while parsing policy."
            }
          },
          "work": []
        },
        {
          "id": "G03",
          "title": "Builds are deterministic and secret-free",
          "class": "entrenched",
          "status": "live",
          "description": "The client compiles canonical immutable bytes; no server builds user source. Current evidence: proved from repository evidence on 2026-07-31 and governed by ADR 0005.",
          "eval": "The same approved source and engine pin produce the same bundle digest. The bundle contains no secret, and no server-side path exists that receives user source to build it.",
          "limit": "A browser compiler may run on the owner's own device, and Control may store owner-only drafts, but Control never compiles them. Determinism is of the bundle, not of the provider's response.",
          "voices": {
            "engineer": {
              "title": "Canonical bytes from a pinned engine",
              "description": "The compiler ships in @smcllns/angel-core and runs client-side. Output is canonical and immutable, addressed by digest and paired with an engine pin. The Broker executes only the sealed template (src/workers/broker.ts:206)."
            },
            "designer": {
              "title": "The same input gives the same artifact",
              "description": "Building twice from the same approved source gives an identical artifact, so the digest a person checks is stable and worth checking. Nothing they typed as a secret ends up inside it."
            },
            "marketing": {
              "title": "Reproducible, and no secrets baked in",
              "description": "The same source builds the same reviewable artifact every time, and your credentials are never part of it."
            },
            "product": {
              "title": "Something to point at",
              "description": "Trust needs an object. A deterministic digest gives owner and agent one identity to compare, which is what later makes verify and replay meaningful rather than decorative."
            },
            "llm": {
              "title": "Never add a server build",
              "description": "Invariants: compile is client-side; output is canonical and digest-addressed; no secret enters the bundle. Do not introduce a server-side compile path, and do not let Control compile a draft it stores."
            }
          },
          "work": []
        }
      ],
      "gate": {
        "id": "GATE-M0",
        "proof": "the foundation publishes from a file the owner can read",
        "status": "passed",
        "description": "M0 closed when a portable policy file, a client-side compile and a published Angel existed together, with no path that sent the owner's source or secrets to a server to be built. Current evidence: repository evidence, verified 2026-07-31.",
        "findings": [
          {
            "text": "The foundation was published but nothing addressed it at a stable public name yet.",
            "disposition": {
              "kind": "adoption-evidence",
              "admits": "WS0"
            }
          }
        ],
        "voices": {
          "engineer": {
            "title": "Client compile and portable policy both land",
            "description": "Closed on the existence of the two mechanisms together: a policy schema with no deployment identity, and a client-side compiler emitting digest-addressed bytes. No server-side build path was ever added."
          },
          "designer": {
            "title": "A readable file, and a thing that runs from it",
            "description": "The check was that the file a person approves and the artifact that runs are connected by a step the person can perform themselves."
          },
          "marketing": {
            "absent": true,
            "reason": "M0 was foundation work with no public audience; nothing shipped here was announced."
          },
          "product": {
            "title": "The trust primitives exist",
            "description": "This gate bought the two primitives everything later depends on — a readable policy and a reproducible artifact. It bought no user journey, and the next epic had to make the result addressable."
          },
          "llm": {
            "title": "Closed on mechanism, not journey",
            "description": "M0 proves the primitives exist. Do not cite it as evidence that a user can do anything end to end; the earliest journey proof is M1."
          }
        }
      }
    },
    {
      "id": "M1",
      "version": "0.2",
      "status": "shipped",
      "outcome": "A real Google call goes through, and two independent gates can stop it. The agent asks for one named tool, the Gateway and the Broker each decide on their own, and disagreement produces no provider call and no fallback.",
      "voices": {
        "engineer": {
          "title": "Two independent authority checks, fail closed",
          "description": "Gateway and Broker evaluate the same call independently against the sealed template. Disagreement or partial install yields no provider call and no degraded path. Provider credentials are leased only by the unaddressable Broker."
        },
        "designer": {
          "title": "It does the real thing, or nothing",
          "description": "A real Google action completes when it is allowed. When the checks disagree, nothing happens — the person sees a refusal rather than a partial or an older-authority retry."
        },
        "marketing": {
          "title": "Real work, with a real stop",
          "description": "Your agent gets the action done through your own Google account, and two separate checks have to agree before anything reaches it."
        },
        "product": {
          "title": "Safety that is worth having",
          "description": "The value is a working provider action; the safety is what makes an owner willing to enable it. Two gates that fail closed trade availability for the guarantee that a refusal is never a silent partial."
        },
        "llm": {
          "title": "No fallback, ever",
          "description": "Invariants: two independent deciders; disagreement produces nothing; credentials leave the Broker only as a lease. Do not add a retry against older authority, a cache of a prior decision, or any degraded path."
        }
      },
      "commitments": [
        {
          "id": "G01",
          "title": "Angel is a toolbox, never an actor",
          "class": "entrenched",
          "status": "live",
          "description": "Only the user's agent initiates an MCP call; Angel has no loop, intent, scheduler, or mailbox. Current evidence: proved from repository evidence on 2026-07-31.",
          "eval": "Trace every execution path to an inbound MCP call from the user's agent. No scheduler, queue, timer, mailbox or background loop can originate one.",
          "limit": "Angel does not supply the agent and does not decide what task to attempt. Being a toolbox is not a claim that the agent using it is well behaved.",
          "voices": {
            "engineer": {
              "title": "No origination path exists",
              "description": "Every execution begins at an inbound MCP request. There is no scheduler, cron, queue consumer or mailbox that can start work, so there is no code path where the platform acts on its own."
            },
            "designer": {
              "title": "Nothing happens unless you ask",
              "description": "The product never surprises a person with an action. Between requests it is inert, which is what makes 'I did not ask for that' impossible rather than merely unlikely."
            },
            "marketing": {
              "title": "It never acts on its own",
              "description": "Angel is a set of tools your agent picks up. It has no agenda, no schedule, and no inbox of its own."
            },
            "product": {
              "title": "The line that makes delegation safe",
              "description": "Owners delegate capability, not initiative. Keeping origination with the user's agent is what lets someone grant a powerful tool without granting an autonomous system."
            },
            "llm": {
              "title": "Never add an originator",
              "description": "Invariant: execution starts only at an inbound MCP call. Do not add a scheduler, cron trigger, queue consumer, webhook-initiated action or retry loop that can begin work."
            }
          },
          "work": []
        },
        {
          "id": "G04",
          "title": "Authority is explicit",
          "class": "entrenched",
          "status": "live",
          "description": "Absent tools do not exist; guards bind arguments; anything unexecutable cannot publish. Current evidence: demonstrated for current adapters, verified 2026-07-31.",
          "eval": "A tool omitted from policy is not discoverable by the agent. An argument cap applies before the provider call, not after. A policy naming an unexecutable operation fails to publish.",
          "limit": "The platform proves fidelity to the policy the owner wrote; it does not judge whether that policy was wise. Demonstrated for current adapters only.",
          "voices": {
            "engineer": {
              "title": "Policy is the whole surface",
              "description": "Tool discovery is generated from policy, so an omitted tool has no descriptor to find. Guards bind arguments before the adapter is invoked. Publish validates that every named operation is executable and refuses otherwise."
            },
            "designer": {
              "title": "If you left it out, it is not there",
              "description": "Someone reading the policy sees exactly the operations that exist. Nothing is hidden behind a default, and a cap they wrote applies to the real call rather than to a report afterwards."
            },
            "marketing": {
              "title": "You choose what it can do",
              "description": "If you do not grant an operation, your agent cannot even find it. Limits you set apply before anything reaches your provider."
            },
            "product": {
              "title": "Least privilege that is legible",
              "description": "The job is granting the smallest useful capability. Generating the surface from policy means the grant and the guarantee are the same artifact, so an owner never has to reconcile two lists."

      "id": "WS3",
      "version": "0.9",
      "status": "planned",
      "outcome": "Scope chosen from Round-2 evidence. Nothing here is approved or specified: the epic exists as the standing promise that Round-2 findings get a destination rather than a backlog.",
      "voices": {

          "absent": true,
          "reason": "No scope exists; there is nothing built or specified to describe."
        },

          "description": "The row exists so that Round-2 findings have somewhere to land that is not a backlog. Its content is deliberately empty until ID-10 closes."
        },

          "title": "Proposed, not approved",
          "description": "WS3 is unapproved and unscoped. Do not add commitments or work here; scope is chosen from M-DF2 evidence after ID-10 reconciles it."
        }
      },
      "commitments": [],
      "gate": {
        "id": "GATE-WS3",
        "proof": "Round-2 evidence, not appetite, chose the scope",
        "status": "planned",
        "description": "Proposed work. The gate condition is that every commitment in WS3 traces to a reconciled Round-2 finding. Unresolved: no scope exists and the owner has approved none.",
        "findings": [],
        "voices": {
          "engineer": {
            "absent": true,
            "reason": "No scope exists to state a condition against beyond its traceability rule."
          },
          "designer": {
            "absent": true,
            "reason": "Nothing designed."
          },
          "marketing": {
            "absent": true,
            "reason": "The workstream is unapproved and unscoped, so there is nothing to announce."
          },
          "product": {
            "title": "Traceability is the whole condition",
            "description": "Stating the rule now, while the scope is empty, is what makes it enforceable later when there is pressure to add something that felt important."
          },
          "llm": {
            "title": "Every WS3 commitment traces to a finding",
            "description": "Invariant: no commitment enters WS3 without a reconciled Round-2 finding behind it. Do not pre-populate this epic."
          }
        }
      }
    },
    {
      "id": "WS4",
      "version": "1.0",
      "status": "planned",
      "outcome": "The product beyond proof. Future workstreams require owner approval and none is proposed in detail; the row holds the place so that long-term work is never mistaken for approved work.",
      "voices": {
        "engineer": {

        },
        "designer": {

        },

        },
        "product": {
          "title": "Named so it cannot be assumed",
          "description": "Long-term intent tends to get quoted as plan. Keeping an explicitly unapproved row is cheaper than repeatedly correcting the assumption."
        },
        "llm": {
          "title": "Requires owner approval",
          "description": "WS4 is unapproved and unscoped. Do not cite it as roadmap, and do not add content without a recorded owner decision."

      },

        "proof": "the owner approves a long-term workstream on its own merits",
        "status": "planned",
        "description": "Proposed work. Unresolved: nothing is scoped and no owner approval exists. This gate cannot be prepared until a workstream is proposed.",
        "findings": [],
        "voices": {
          "engineer": {
            "absent": true,

          },

            "description": "Never mark this gate anything but planned without a recorded owner decision. Do not approve product work on the owner's behalf."

</script>
<script>
/* Product Ledger — Card renderer (zero dependency).
   Auto-renders the JSON in <script id="ledger"> into #ledger-root (or <body>).
   Also exposes window.renderRoadmap(data, mountEl) for the hand-HTML path.

   Voice cascade: Owner = ★ canonical (base fields; epics use firstSentence(outcome),
   gates use proof/description). Engineer + designer are the ground truths; every
   other voice narrows, never contradicts. Epics, commitments, features/tasks AND
   gates each carry per-voice {title, description}; a voice may be `absent` + reason. */
(function () {
  "use strict";

  var AUDS = ["owner", "engineer", "designer", "marketing", "product", "llm"];
  var AUDL = { owner: "Owner \u2605", engineer: "Engineer", designer: "Designer", marketing: "Marketing", product: "Product", llm: "LLM" };
  // Every expandable row is a real control: reachable by Tab, operable by Enter
  // or Space, and its state announced. `data-x` stays the wiring hook.
  var ROW = 'data-x tabindex="0" role="button" aria-expanded="false"';
  var TONE = { shipped: "green", passed: "green", live: "green", done: "green", active: "blue", "in-progress": "blue", pending: "amber", planned: "grey" };

  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
  var label = function (s) { return s.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); };
  function firstSentence(s) { var m = s.match(/^(.*?\.)\s/); return m ? m[1].replace(/\.$/, "") : s; }
  var checkStr = function (c) { return c ? (c.minutes ? c.kind + " \u00b7 " + c.minutes + " min" : c.kind) : ""; };
  var notYetStr = function (n) { return n.claim + " \u2014 binds design now (" + n.bindsDesign + "); claims at " + n.claimsAt; };
  var dispoStr = function (d) {
    return d.kind === "adoption-evidence" ? "adoption evidence \u2192 admits " + d.admits
      : label(d.kind) + (d.note ? " (" + d.note + ")" : "");
  };
  var boxState = function (t) { return t === "green" ? "done" : t === "blue" ? "wip" : "todo"; };

  function commitmentFields(c) {
    var f = [["eval", c.eval], ["limit", c.limit]];
    if (c.notYet) f.push(["not yet", notYetStr(c.notYet)]);
    (c.amendments || []).forEach(function (a) { f.push(["amends", a.in + " \u2014 " + a.change]); });
    return f;
  }
  function workFields(w) {
    var f = [["type", w.type], ["check", checkStr(w.check)]];
    if (w.exhibit) f.push(["exhibit", w.exhibit]);
    if (w.note) f.push(["note", w.note]);
    if (w.source) f.push(["source", w.source]);
    if (w.serves) f.push(["serves", w.serves + " (no governing law)"]);
    return f;
  }
  function cbxSvg(state) {
    var c = state === "done" ? "#1c6b58" : state === "wip" ? "#2b5fa8" : "#c2c7cd";
    var box = '<rect x="1" y="1" width="15" height="15" rx="4.5" fill="' + (state === "done" ? c : "none") + '" stroke="' + c + '" stroke-width="1.5"/>';
    var mark = state === "done"
      ? '<path d="M4.7 8.6 7.2 11 12 5.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
      : state === "wip" ? '<path d="M4.6 8.5 H11.4" stroke="' + c + '" stroke-width="1.7" stroke-linecap="round"/>' : "";
    return '<svg class="cbx" viewBox="0 0 17 17" aria-hidden="true">' + box + mark + "</svg>";
  }

  // Each mount gets its own state so multiple ledgers can coexist on a page.
  function mount(root, RAW) {
    var VOICE = {};
    var AUDIENCE = "owner";
    var ITEMS = [];

    function regVoice(id, ownerTitle, ownerDesc, voices) {
      var m = { owner: { title: ownerTitle, description: ownerDesc } };
      if (voices) for (var a in voices) m[a] = voices[a];
      VOICE[id] = m;
    }
    RAW.releases.forEach(function (e) {
      regVoice(e.id, firstSentence(e.outcome), e.outcome, e.voices);
      if (e.gate) regVoice(e.gate.id, e.gate.proof, e.gate.description || e.gate.proof, e.gate.voices);
      (e.commitments || []).forEach(function (c) {
        regVoice(c.id, c.title, c.description, c.voices);
        (c.work || []).forEach(function (w) { regVoice(w.id, w.title, w.description, w.voices); });
      });
      (e.unattachedWork || []).forEach(function (w) { regVoice(w.id, w.title, w.description, w.voices); });
    });

    var vtitle = function (id) { return '<span class="vtitle" data-vt="' + id + '">' + esc(VOICE[id].owner.title) + "</span>"; };
    var vdesc = function (id) { return '<span class="vtext" data-vd="' + id + '">' + esc(VOICE[id].owner.description) + "</span>"; };
    var asOf = function () { var a = RAW.releases.find(function (r) { return r.status === "active"; }); return (a || RAW.releases[RAW.releases.length - 1]).id; };
    var totalC = function () { return RAW.releases.reduce(function (n, e) { return n + (e.commitments || []).length; }, 0); };

    function audHtml() {
      return '<div class="aud"><span class="audlabel">Voice</span>' +
        AUDS.map(function (a) { return '<button class="audbtn' + (a === AUDIENCE ? " on" : "") + '" data-aud="' + a + '">' + AUDL[a] + "</button>"; }).join("") + "</div>";
    }
    function detailDL(leadHtml, fields) {
      var h = leadHtml ? '<p class="dsc">' + leadHtml + "</p>" : "";
      h += "<dl>";
      fields.forEach(function (f) { h += "<dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd>"; });
      return h + "</dl>";
    }
    function gateDL(g) {
      var h = '<p class="dsc">' + vdesc(g.id) + "</p><dl><dt>proof</dt><dd>" + esc(g.proof) + "</dd>";
      (g.findings || []).forEach(function (f) { h += "<dt>finding</dt><dd>" + esc(f.text) + " \u2192 <em>" + esc(dispoStr(f.disposition)) + "</em></dd>"; });
      return h + "</dl>";
    }
    function cardItem(w) {
      var t = TONE[w.status] || "grey", st = boxState(t), done = st === "done";
      var stat = done ? "" : '<span class="fstat t-' + t + '">' + label(w.status) + "</span>";
      return '<div class="fitem ' + (done ? "done" : "") + '" ' + ROW + '>' +
        cbxSvg(st) + '<span class="fid">' + w.id + "</span>" +
        '<span class="ftitle">' + vtitle(w.id) + "</span>" + stat + '<span class="caret">\u25b8</span>' +
        '</div><div class="det fdet"><div class="det-in"><div class="scope">' + detailDL(vdesc(w.id), workFields(w)) + "</div></div></div>";
    }

    function render() {
      var h = '<div class="inner">' +
        '<div class="brow"><span class="kicker">Roadmap</span><span class="folio">As of ' + asOf() + " \u00b7 " + totalC() + " commitments</span></div>" +
        "<h1>Product Ledger</h1>" +
        '<p class="sub">' + esc(RAW.product) + ' \u2014 each epic a container, each commitment a card, each feature a checklist item.</p>' +
        '<div class="ctlbar"><div class="ctl"><button class="ctlbtn" data-all>Expand all</button><span class="sep">\u00b7</span><button class="ctlbtn" data-none>Collapse all</button></div>' + audHtml() + "</div>";
      RAW.releases.forEach(function (e) {
        var et = TONE[e.status] || "grey";
        h += '<div class="ecard"><div class="ehead" ' + ROW + '>' +
          '<span class="ebadge">' + e.id + "</span>" +
          '<span class="etitle"><span class="ver">' + esc(e.version) + "</span> " + vtitle(e.id) + "</span>" +
          '<span class="grow"></span><span class="pill t-' + et + '"><span class="pip"></span>' + label(e.status) + "</span>" +
          '<span class="caret">\u25b8</span></div>' +
          '<div class="det"><div class="det-in"><p class="dsc" style="padding:0 1rem">' + vdesc(e.id) + "</p></div></div>";
        (e.commitments || []).forEach(function (c) {
          var ct = TONE[c.status] || "grey";
          h += '<div class="ccard"><div class="chead" ' + ROW + '>' +
            '<span class="cid">' + c.id + "</span>" +
            '<span class="ctitle">' + vtitle(c.id) + "</span>" +
            '<span class="tag ' + (c.class === "entrenched" ? "ent" : "amd") + '">' + c.class + "</span>" +
            '<span class="grow"></span><span class="pill t-' + ct + '"><span class="pip"></span>' + label(c.status) + "</span>" +
            '<span class="caret">\u25b8</span></div>' +
            '<div class="det"><div class="det-in"><div class="claw">' + detailDL(vdesc(c.id), commitmentFields(c)) + "</div></div></div>" +
            '<div class="checklist">';
          (c.work || []).forEach(function (w) { h += cardItem(w); });
          h += "</div></div>";
        });
        var loose = e.unattachedWork || [];
        if (loose.length) {
          var serves = loose.map(function (w) { return w.serves; }).filter(Boolean).filter(function (v, i, a) { return a.indexOf(v) === i; });
          h += '<div class="loose"><div class="llabel">' + esc("Unattached" + (serves.length ? " \u00b7 serves " + serves.join(", ") : "")) + "</div>";
          loose.forEach(function (w) { h += cardItem(w); });
          h += "</div>";
        }
        if (e.gate) {
          var gt = TONE[e.gate.status] || "grey";
          h += '<div class="gate"><div class="gfoot" ' + ROW + '>' +
            '<span class="gflag">\ud83c\udfc1</span><span class="gid t-' + gt + '">' + e.gate.id + "</span>" +
            '<span class="gproof">\u201c' + vtitle(e.gate.id) + "\u201d</span>" +
            '<span class="grow"></span><span class="pill t-' + gt + '"><span class="pip"></span>' + label(e.gate.status) + "</span>" +
            '<span class="caret">\u25b8</span></div>' +
            '<div class="det gdet"><div class="det-in">' + gateDL(e.gate) + "</div></div></div>";
        }
        h += "</div>"; // ecard
      });
      h += "</div>";

      var wrap = document.createElement("div");
      wrap.className = "v-card";
      wrap.innerHTML = h;
      root.innerHTML = "";
      root.appendChild(wrap);
      wireRows(wrap);
      wireVoice(wrap);
    }

    function setOpen(item, open) {
      if (open) { item.det.style.height = item.det.firstElementChild.offsetHeight + "px"; item.row.classList.add("open"); }
      else { item.det.style.height = "0px"; item.row.classList.remove("open"); }
      item.row.setAttribute("aria-expanded", open ? "true" : "false");
      item.open = open;
    }
    function wireRows(wrap) {
      ITEMS = [];
      wrap.querySelectorAll("[data-x]").forEach(function (row) {
        var item = { row: row, det: row.nextElementSibling, open: false };
        var toggle = function (e) { e.stopPropagation(); setOpen(item, !item.open); };
        row.addEventListener("click", toggle);
        row.addEventListener("keydown", function (e) {
          // Space scrolls the page by default on a div; Enter and Space both act.
          if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(e); }
        });
        ITEMS.push(item);
      });
      wrap.querySelector("[data-all]").addEventListener("click", function () { ITEMS.forEach(function (i) { setOpen(i, true); }); });
      wrap.querySelector("[data-none]").addEventListener("click", function () { ITEMS.forEach(function (i) { setOpen(i, false); }); });
    }
    function setAudience(a) {
      AUDIENCE = a;
      document.querySelectorAll(".audbtn").forEach(function (b) { b.classList.toggle("on", b.dataset.aud === a); });
      root.querySelectorAll(".vtitle").forEach(function (s) {
        var v = VOICE[s.dataset.vt]; if (!v) return;
        var cell = v[a];
        s.textContent = (cell && !cell.absent && cell.title != null) ? cell.title : v.owner.title;
      });
      root.querySelectorAll(".vtext").forEach(function (s) {
        var v = VOICE[s.dataset.vd]; if (!v) return;
        var cell = v[a];
        if (cell && cell.absent) { s.classList.add("vabsent"); s.textContent = cell.reason; }
        else { s.classList.remove("vabsent"); s.textContent = (cell && cell.description != null) ? cell.description : v.owner.description; }
      });
      ITEMS.forEach(function (i) { if (i.open) i.det.style.height = i.det.firstElementChild.offsetHeight + "px"; });
    }
    function wireVoice(wrap) {
      wrap.querySelectorAll(".audbtn").forEach(function (b) {
        b.addEventListener("click", function (e) { e.stopPropagation(); setAudience(b.dataset.aud); });
      });
    }

    render();
  }

  window.renderRoadmap = function (RAW, mountEl) { mount(mountEl || document.body, RAW); };

  var dataEl = document.getElementById("ledger");
  if (dataEl) {
    var RAW = JSON.parse(dataEl.textContent);
    mount(document.getElementById("ledger-root") || document.body, RAW);
  }
})();

</script>
</body>

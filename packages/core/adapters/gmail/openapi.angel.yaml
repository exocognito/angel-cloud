    ListDraftsResponse:
      type: object
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
          description: List of drafts. Note that the `Message` property in each `Draft` resource only contains
            an `id` and a `threadId`. The
            [`messages.get`](https://developers.google.com/workspace/gmail/api/v1/reference/users/messages/get)
            method can fetch additional message details.
        nextPageToken:
          type: string
          description: Token to retrieve the next page of results in the list.
        resultSizeEstimate:
          description: Estimated total number of results.
          type: integer
          format: uint32
    ListHistoryResponse:
      type: object
      properties:
        historyId:
          description: The ID of the mailbox's current history record.
          type: string
          format: uint64
        history:
          description: List of history records. Any `messages` contained in the response will typically only
            have `id` and `threadId` fields populated.
          type: array
          items:
            $ref: "#/components/schemas/History"
        nextPageToken:
          description: Page token to retrieve the next page of results in the list.
          type: string
    ListLabelsResponse:
      properties:
        labels:
          description: List of labels. Note that each label resource only contains an `id`, `name`,
            `messageListVisibility`, `labelListVisibility`, and `type`. The
            [`labels.get`](https://developers.google.com/workspace/gmail/api/v1/reference/users/labels/get)
            method can fetch additional label details.
          type: array
          items:
            $ref: "#/components/schemas/Label"
      type: object
    ListMessagesResponse:
      type: object
      properties:
        nextPageToken:
          description: Token to retrieve the next page of results in the list.
          type: string
        messages:
          description: List of messages. Note that each message resource contains only an `id` and a
            `threadId`. Additional message details can be fetched using the messages.get method.
          type: array
          items:
            $ref: "#/components/schemas/Message"
        resultSizeEstimate:
          description: Estimated total number of results.
          type: integer
          format: uint32
    ListThreadsResponse:
      type: object
      properties:
        threads:
          description: List of threads. Note that each thread resource does not contain a list of `messages`.
            The list of `messages` for a given thread can be fetched using the
            [`threads.get`](https://developers.google.com/workspace/gmail/api/v1/reference/users/threads/get)
            method.
          type: array
          items:
            $ref: "#/components/schemas/Thread"
        resultSizeEstimate:
          type: integer
          format: uint32
          description: Estimated total number of results.
        nextPageToken:
          description: Page token to retrieve the next page of results in the list.
          type: string
    Message:
      description: An email message.
      type: object
      properties:
        sizeEstimate:
          type: integer
          format: int32
          description: Estimated size in bytes of the message.
        threadId:
          type: string
          description: "The ID of the thread the message belongs to. To add a message or draft to a thread,
            the following criteria must be met: 1. The requested `threadId` must be specified on the
            `Message` or `Draft.Message` you supply with your request. 2. The `References` and
            `In-Reply-To` headers must be set in compliance with the [RFC
            2822](https://tools.ietf.org/html/rfc2822) standard. 3. The `Subject` headers must
            match. "
        historyId:
          format: uint64
          type: string
          description: The ID of the last history record that modified this message.
        snippet:
          description: A short part of the message text.
          type: string
        classificationLabelValues:
          description: Classification Label values on the message. Available Classification Label schemas can
            be queried using the Google Drive Labels API. Each classification label ID must be
            unique. If duplicate IDs are provided, only one will be retained, and the selection is
            arbitrary. Only used for Google Workspace accounts. There's a limit of 20 Classification
            Label values per request. If the Classification Label values exceeds the maximum allowed
            number, the request fails.
          type: array
          items:
            $ref: "#/components/schemas/ClassificationLabelValue"
        labelIds:
          description: List of IDs of labels applied to this message.
          type: array
          items:
            type: string
        internalDate:
          description: The internal message creation timestamp (epoch ms), which determines ordering in the
            inbox. For normal SMTP-received email, this represents the time the message was
            originally accepted by Google, which is more reliable than the `Date` header. However,
            for API-migrated mail, it can be configured by client to be based on the `Date` header.
          type: string
          format: int64
        raw:
          type: string
          format: byte
          description: The entire email message in an RFC 2822 formatted and base64url encoded string.
            Returned in `messages.get` and `drafts.get` responses when the `format=RAW` parameter is
            supplied. @required gmail.users.drafts.create gmail.users.drafts.update
        payload:
          description: The parsed email structure in the message parts.
          $ref: "#/components/schemas/MessagePart"
    MessagePart:
      description: A single MIME message part.
      properties:
        mimeType:
          type: string
          description: The MIME type of the message part.
        filename:
          type: string
          description: The filename of the attachment. Only present if this message part represents an
            attachment.
        headers:
          description: List of headers on this message part. For the top-level message part, representing the
            entire message payload, it will contain the standard RFC 2822 email headers such as
            `To`, `From`, and `Subject`.
          type: array
          items:
            $ref: "#/components/schemas/MessagePartHeader"
        partId:
          description: The immutable ID of the message part.
          type: string
        body:
          $ref: "#/components/schemas/MessagePartBody"
          description: The message part body for this part, which may be empty for container MIME message parts.
        parts:
          type: array
          items:
            $ref: "#/components/schemas/MessagePart"
          description: The child MIME message parts of this part. This only applies to container MIME message
            parts, for example `multipart/*`. For non- container MIME message part types, such as
            `text/plain`, this field is empty. For more information, see RFC 1521.
      type: object
    MessagePartBody:
      properties:
        attachmentId:
          type: string
          description: When present, contains the ID of an external attachment that can be retrieved in a
            separate `messages.attachments.get` request. When not present, the entire content of the
            message part body is contained in the data field.
        size:
          type: integer
          format: int32
          description: Number of bytes for the message part data (encoding notwithstanding).
        data:
          type: string
          format: byte
          description: The body data of a MIME message part as a base64url encoded string. May be empty for
            MIME container types that have no message body or when the body data is sent as a
            separate attachment. An attachment ID is present if the body data is contained in a
            separate attachment.
      type: object
      description: The body of a single MIME message part.
    MessagePartHeader:
      type: object
      properties:
        name:
          type: string
          description: The name of the header before the `:` separator. For example, `To`.
        value:
          description: The value of the header after the `:` separator. For example, `someuser@example.com`.
          type: string
    ModifyMessageRequest:
      type: object
      properties:
        addLabelIds:
          type: array
          items:
            type: string
          description: A list of IDs of labels to add to this message. You can add up to 100 labels with each
            update.
        addClassificationLabels:
          description: A list of classification label values to add. If a Classification Label with the same
            label ID is already applied to the message, fields with existing field IDs will be
            updated and fields with new field IDs will be added. There's a limit of 20
            Classification Label values per request. If the message is already classified and the
            final total number of Classification Label values exceeds the maximum allowed number of
            Classification Label values per message, the modification fails.
          type: array
          items:
            $ref: "#/components/schemas/ClassificationLabelValue"
        removeClassificationLabelIds:
          type: array
          items:
            type: string
          description: A list of Classification Label values to remove from this message.
        removeLabelIds:
          description: A list IDs of labels to remove from this message. You can remove up to 100 labels with
            each update.
          type: array
          items:
            type: string
    ModifyThreadRequest:
      type: object
      properties:
        removeLabelIds:
          type: array
          items:
            type: string
          description: A list of IDs of labels to remove from this thread. You can remove up to 100 labels
            with each update.
        addLabelIds:
          description: A list of IDs of labels to add to this thread. You can add up to 100 labels with each
            update.
          type: array
          items:
            type: string
    Profile:
      description: Profile for a Gmail user.
      properties:
        threadsTotal:
          format: int32
          type: integer
          description: The total number of threads in the mailbox.
        emailAddress:
          type: string
          description: The user's email address.
        messagesTotal:
          description: The total number of messages in the mailbox.
          format: int32
          type: integer
        historyId:
          description: The ID of the mailbox's current history record.
          type: string
          format: uint64
      type: object
    Thread:
      description: A collection of messages representing a conversation.
      type: object
      properties:
        historyId:
          description: The ID of the last history record that modified this thread.
          format: uint64
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: The list of messages in the thread.
        snippet:
          description: A short part of the message text.
          type: string
    VacationSettings:
      description: Vacation auto-reply settings for an account. These settings correspond to the "Vacation
        responder" feature in the web interface.
      type: object
      properties:
        startTime:
          type: string
          format: int64
          description: An optional start time for sending auto-replies (epoch ms). When this is specified,
            Gmail will automatically reply only to messages that it receives after the start time.
            If both `startTime` and `endTime` are specified, `startTime` must precede `endTime`.
        restrictToDomain:
          type: boolean
          description: Flag that determines whether responses are sent to recipients who are outside of the
            user's domain. This feature is only available for Google Workspace users.
        responseSubject:
          type: string
          description: Optional text to prepend to the subject line in vacation responses. In order to enable
            auto-replies, either the response subject or the response body must be nonempty.
        restrictToContacts:
          description: Flag that determines whether responses are sent to recipients who are not in the user's
            list of contacts.
          type: boolean
        responseBodyHtml:
          type: string
          description: Response body in HTML format. Gmail will sanitize the HTML before storing it. If both
            `response_body_plain_text` and `response_body_html` are specified, `response_body_html`
            will be used.
        responseBodyPlainText:
          description: Response body in plain text format. If both `response_body_plain_text` and
            `response_body_html` are specified, `response_body_html` will be used.
          type: string
        enableAutoReply:
          type: boolean
          description: Flag that controls whether Gmail automatically replies to messages.
        endTime:
          description: An optional end time for sending auto-replies (epoch ms). When this is specified, Gmail
            will automatically reply only to messages that it receives before the end time. If both
            `startTime` and `endTime` are specified, `startTime` must precede `endTime`.
          format: int64
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://mail.google.com/: https://mail.google.com/
            https://www.googleapis.com/auth/gmail.addons.current.action.compose: https://www.googleapis.com/auth/gmail.addons.current.action.compose
            https://www.googleapis.com/auth/gmail.addons.current.message.action: https://www.googleapis.com/auth/gmail.addons.current.message.action
            https://www.googleapis.com/auth/gmail.addons.current.message.metadata: https://www.googleapis.com/auth/gmail.addons.current.message.metadata
            https://www.googleapis.com/auth/gmail.addons.current.message.readonly: https://www.googleapis.com/auth/gmail.addons.current.message.readonly
            https://www.googleapis.com/auth/gmail.compose: https://www.googleapis.com/auth/gmail.compose
            https://www.googleapis.com/auth/gmail.insert: https://www.googleapis.com/auth/gmail.insert
            https://www.googleapis.com/auth/gmail.labels: https://www.googleapis.com/auth/gmail.labels
            https://www.googleapis.com/auth/gmail.metadata: https://www.googleapis.com/auth/gmail.metadata
            https://www.googleapis.com/auth/gmail.modify: https://www.googleapis.com/auth/gmail.modify
            https://www.googleapis.com/auth/gmail.readonly: https://www.googleapis.com/auth/gmail.readonly
            https://www.googleapis.com/auth/gmail.send: https://www.googleapis.com/auth/gmail.send
            https://www.googleapis.com/auth/gmail.settings.basic: https://www.googleapis.com/auth/gmail.settings.basic
            https://www.googleapis.com/auth/gmail.settings.sharing: https://www.googleapis.com/auth/gmail.settings.sharing

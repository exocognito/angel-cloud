            description: The user's email address. The special value `me` can be used to indicate the
              authenticated user.
            type: string
        - name: q
          in: query
          required: false
          description: 'Only return draft messages matching the specified query. Supports the same query
            format as the Gmail search box. For example, `"from:someuser@example.com rfc822msgid:
            is:unread"`.'
          schema:
            description: 'Only return draft messages matching the specified query. Supports the same query
              format as the Gmail search box. For example, `"from:someuser@example.com rfc822msgid:
              is:unread"`.'

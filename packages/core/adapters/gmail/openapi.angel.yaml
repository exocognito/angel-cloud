components:
  schemas:
    AutoForwarding:
      description: Auto-forwarding settings for an account.
      type: object
      properties:
        disposition:
          enumDescriptions:
            - Unspecified disposition.
            - Leave the message in the `INBOX`.
            - Archive the message.
            - Move the message to the `TRASH`.
            - Leave the message in the `INBOX` and mark it as read.
          type: string
          description: The state that a message should be left in after it has been forwarded.
          enum:
            - dispositionUnspecified
            - leaveInInbox
            - archive
            - trash
            - markRead
        emailAddress:
          description: Email address to which all incoming messages are forwarded. This email address must be
            a verified member of the forwarding addresses.
          type: string
        enabled:
          description: Whether all incoming mail is automatically forwarded to another address.
          type: boolean
    ClassificationLabelFieldValue:
      type: object
      properties:
        fieldId:
          description: Required. The field ID for the Classification Label Value. Maps to the ID field of the
            Google Drive `Label.Field` object.
          type: string
        selection:
          description: Selection choice ID for the selection option. Should only be set if the field type is
            `SELECTION` in the Google Drive `Label.Field` object. Maps to the id field of the Google
            Drive `Label.Field.SelectionOptions` resource.
          type: string
      description: Field values for a classification label.
    ClassificationLabelValue:
      description: Classification Labels applied to the email message. Classification Labels are different
        from Gmail inbox labels. Only used for Google Workspace accounts. [Learn more about
        classification labels](https://support.google.com/a/answer/9292382).
      type: object
      properties:
        labelId:
          type: string
          description: Required. The canonical or raw alphanumeric classification label ID. Maps to the ID
            field of the Google Drive Label resource.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationLabelFieldValue"
          description: Field values for the given classification label ID.
    Draft:
      description: A draft email in the user's mailbox.
      properties:
        message:
          $ref: "#/components/schemas/Message"
          description: The message content of the draft.
      type: object
    History:
      type: object
      properties:
        messagesDeleted:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMessageDeleted"
          description: Messages deleted (not Trashed) from the mailbox in this history record.
        labelsAdded:
          description: Labels added to messages in this history record.
          type: array
          items:
            $ref: "#/components/schemas/HistoryLabelAdded"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
          description: List of messages changed in this history record. The fields for specific change types,
            such as `messagesAdded` may duplicate messages in this field. We recommend using the
            specific change-type fields instead of this.
        labelsRemoved:
          type: array
          items:
            $ref: "#/components/schemas/HistoryLabelRemoved"
          description: Labels removed from messages in this history record.
        messagesAdded:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMessageAdded"
          description: Messages added to the mailbox in this history record.
      description: A record of a change to the user's mailbox. Each history change may affect multiple
        messages in multiple ways.
    HistoryLabelAdded:
      properties:
        labelIds:
          description: Label IDs added to the message.
          type: array
          items:
            type: string
        message:
          $ref: "#/components/schemas/Message"
      type: object
    HistoryLabelRemoved:
      type: object
      properties:
        labelIds:
          description: Label IDs removed from the message.
          type: array
          items:
            type: string
        message:
          $ref: "#/components/schemas/Message"
    HistoryMessageAdded:
      properties:
        message:
          $ref: "#/components/schemas/Message"
      type: object
    HistoryMessageDeleted:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/Message"
    Label:
      properties:
        labelListVisibility:
          enumDescriptions:
            - Show the label in the label list.
            - Show the label if there are any unread messages with that label.
            - Do not show the label in the label list.
          type: string
          description: The visibility of the label in the label list in the Gmail web interface.
          enum:
            - labelShow
            - labelShowIfUnread
            - labelHide
        messagesUnread:
          format: int32
          type: integer
          description: The number of unread messages with the label.
        threadsTotal:
          type: integer
          format: int32
          description: The total number of threads with the label.
        messagesTotal:
          description: The total number of messages with the label.
          type: integer
          format: int32
        threadsUnread:
          type: integer
          format: int32
          description: The number of unread threads with the label.
        color:
          $ref: "#/components/schemas/LabelColor"
          description: The color to assign to the label. Color is only available for labels that have their
            `type` set to `user`.
        messageListVisibility:
          enum:
            - show
            - hide
          description: The visibility of messages with this label in the message list in the Gmail web
            interface.
          enumDescriptions:
            - Show the label in the message list.
            - Do not show the label in the message list.
          type: string
        name:
          type: string
          description: The display name of the label.
        type:
          description: The owner type for the label. User labels are created by the user and can be modified
            and deleted by the user and can be applied to any message or thread. System labels are
            internally created and cannot be added, modified, or deleted. System labels may be able
            to be applied to or removed from messages and threads under some circumstances but this
            is not guaranteed. For example, users can apply and remove the `INBOX` and `UNREAD`
            labels from messages and threads, but cannot apply or remove the `DRAFTS` or `SENT`
            labels from messages or threads.
          enum:
            - system
            - user
          type: string
          enumDescriptions:
            - Labels created by Gmail.
            - Custom labels created by the user or application.
      type: object
      description: Labels are used to categorize messages and threads within the user's mailbox. The
        maximum number of labels supported for a user's mailbox is 10,000.

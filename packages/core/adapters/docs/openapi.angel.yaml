      description: A mask that indicates which of the fields on the base LinkedContentReference have been
        changed in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        sheetsChartReferenceSuggestionState:
          description: A mask that indicates which of the fields in sheets_chart_reference have been changed
            in this suggestion.
          $ref: "#/components/schemas/SheetsChartReferenceSuggestionState"
      type: object
    List:
      description: A List represents the list attributes for a group of paragraphs that all belong to the
        same list. A paragraph that's part of a list has a reference to the list's ID in its bullet.
      properties:
        suggestedListPropertiesChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedListProperties"
          description: The suggested changes to the list properties, keyed by suggestion ID.
        suggestedDeletionIds:
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this list.
          type: array
          items:
            type: string
        listProperties:
          description: The properties of the list.
          $ref: "#/components/schemas/ListProperties"
        suggestedInsertionId:
          description: The suggested insertion ID. If empty, then this is not a suggested insertion.
          type: string
      type: object
    ListProperties:
      description: The properties of a list that describe the look and feel of bullets belonging to
        paragraphs associated with a list.
      properties:
        nestingLevels:
          description: Describes the properties of the bullets at the associated level. A list has at most 9
            levels of nesting with nesting level 0 corresponding to the top-most level and nesting
            level 8 corresponding to the most nested level. The nesting levels are returned in
            ascending order with the least nested returned first.
          type: array
          items:
            $ref: "#/components/schemas/NestingLevel"
      type: object
    ListPropertiesSuggestionState:
      description: A mask that indicates which of the fields on the base ListProperties have been changed
        in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        nestingLevelsSuggestionStates:
          items:
            $ref: "#/components/schemas/NestingLevelSuggestionState"
          description: A mask that indicates which of the fields on the corresponding NestingLevel in
            nesting_levels have been changed in this suggestion. The nesting level suggestion states
            are returned in ascending order of the nesting level with the least nested returned
            first.
          type: array
      type: object
    NamedRange:
      description: A collection of Ranges with the same named range ID. Named ranges allow developers to
        associate parts of a document with an arbitrary user-defined label so their contents can be
        programmatically read or edited later. A document can contain multiple named ranges with the
        same name, but every named range has a unique ID. A named range is created with a single
        Range, and content inserted inside a named range generally expands that range. However,
        certain document changes can cause the range to be split into multiple ranges. Named ranges
        are not private. All applications and collaborators that have access to the document can see
        its named ranges.
      properties:
        namedRangeId:
          description: The ID of the named range.
          type: string
        ranges:
          description: The ranges that belong to this named range.
          type: array
          items:
            $ref: "#/components/schemas/Range"
        name:
          type: string
          description: The name of the named range.
      type: object
    NamedRanges:
      type: object
      description: A collection of all the NamedRanges in the document that share a given name.
      properties:
        namedRanges:
          description: The NamedRanges that share the same name.
          type: array
          items:
            $ref: "#/components/schemas/NamedRange"
        name:
          type: string
          description: The name that all the named ranges share.
    NamedStyle:
      description: A named style. Paragraphs in the document can inherit their TextStyle and
        ParagraphStyle from this named style when they have the same named style type.
      properties:
        namedStyleType:
          type: string
          description: The type of this named style.
          enum:
            - NAMED_STYLE_TYPE_UNSPECIFIED
            - NORMAL_TEXT
            - TITLE
            - SUBTITLE
            - HEADING_1
            - HEADING_2
            - HEADING_3
            - HEADING_4
            - HEADING_5
            - HEADING_6
          enumDescriptions:
            - The type of named style is unspecified.
            - Normal text.
            - Title.
            - Subtitle.
            - Heading 1.
            - Heading 2.
            - Heading 3.
            - Heading 4.
            - Heading 5.
            - Heading 6.
        textStyle:
          description: The text style of this named style.
          $ref: "#/components/schemas/TextStyle"
        paragraphStyle:
          description: The paragraph style of this named style.
          $ref: "#/components/schemas/ParagraphStyle"
      type: object
    NamedStyleSuggestionState:
      description: A suggestion state of a NamedStyle message.
      properties:
        textStyleSuggestionState:
          description: A mask that indicates which of the fields in text style have been changed in this
            suggestion.
          $ref: "#/components/schemas/TextStyleSuggestionState"
        namedStyleType:
          enumDescriptions:
            - The type of named style is unspecified.
            - Normal text.
            - Title.
            - Subtitle.
            - Heading 1.
            - Heading 2.
            - Heading 3.
            - Heading 4.
            - Heading 5.
            - Heading 6.
          description: The named style type that this suggestion state corresponds to. This field is provided
            as a convenience for matching the NamedStyleSuggestionState with its corresponding
            NamedStyle.
          enum:
            - NAMED_STYLE_TYPE_UNSPECIFIED
            - NORMAL_TEXT
            - TITLE
            - SUBTITLE
            - HEADING_1
            - HEADING_2
            - HEADING_3
            - HEADING_4
            - HEADING_5
            - HEADING_6
          type: string
        paragraphStyleSuggestionState:
          description: A mask that indicates which of the fields in paragraph style have been changed in this
            suggestion.
          $ref: "#/components/schemas/ParagraphStyleSuggestionState"
      type: object
    NamedStyles:
      description: The named styles. Paragraphs in the document can inherit their TextStyle and
        ParagraphStyle from these named styles.
      properties:
        styles:
          items:
            $ref: "#/components/schemas/NamedStyle"
          type: array
          description: The named styles. There's an entry for each of the possible named style types.
      type: object
    NamedStylesSuggestionState:
      type: object
      description: The suggestion state of a NamedStyles message.
      properties:
        stylesSuggestionStates:
          items:
            $ref: "#/components/schemas/NamedStyleSuggestionState"
          description: A mask that indicates which of the fields on the corresponding NamedStyle in styles
            have been changed in this suggestion. The order of these named style suggestion states
            matches the order of the corresponding named style within the named styles suggestion.
          type: array
    NestingLevel:
      description: Contains properties describing the look and feel of a list bullet at a given level of
        nesting.
      properties:
        bulletAlignment:
          description: The alignment of the bullet within the space allotted for rendering the bullet.
          enum:
            - BULLET_ALIGNMENT_UNSPECIFIED
            - START
            - CENTER
            - END
          type: string
          enumDescriptions:
            - The bullet alignment is unspecified.
            - The bullet is aligned to the start of the space allotted for rendering the bullet.
              Left-aligned for LTR text, right-aligned otherwise.
            - The bullet is aligned to the center of the space allotted for rendering the bullet.
            - The bullet is aligned to the end of the space allotted for rendering the bullet.
              Right-aligned for LTR text, left-aligned otherwise.
        glyphFormat:
          description: The format string used by bullets at this level of nesting. The glyph format contains
            one or more placeholders, and these placeholders are replaced with the appropriate
            values depending on the glyph_type or glyph_symbol. The placeholders follow the pattern
            `%[nesting_level]`. Furthermore, placeholders can have prefixes and suffixes. Thus, the
            glyph format follows the pattern `%[nesting_level]`. Note that the prefix and suffix are
            optional and can be arbitrary strings. For example, the glyph format `%0.` indicates
            that the rendered glyph will replace the placeholder with the corresponding glyph for
            nesting level 0 followed by a period as the suffix. So a list with a glyph type of
            UPPER_ALPHA and glyph format `%0.` at nesting level 0 will result in a list with
            rendered glyphs `A.` `B.` `C.` The glyph format can contain placeholders for the current
            nesting level as well as placeholders for parent nesting levels. For example, a list can
            have a glyph format of `%0.` at nesting level 0 and a glyph format of `%0.%1.` at
            nesting level 1. Assuming both nesting levels have DECIMAL glyph types, this would
            result in a list with rendered glyphs `1.` `2.` ` 2.1.` ` 2.2.` `3.` For nesting levels
            that are ordered, the string that replaces a placeholder in the glyph format for a
            particular paragraph depends on the paragraph's order within the list.
          type: string
        indentStart:
          description: The amount of indentation for paragraphs at this level of nesting. Applied to the side
            that corresponds to the start of the text, based on the paragraph's content direction.
          $ref: "#/components/schemas/Dimension"
        glyphSymbol:
          type: string
          description: A custom glyph symbol used by bullets when paragraphs at this level of nesting is
            unordered. The glyph symbol replaces placeholders within the glyph_format. For example,
            if the glyph_symbol is the solid circle corresponding to Unicode U+25cf code point and
            the glyph_format is `%0`, the rendered glyph would be the solid circle.
        textStyle:
          description: The text style of bullets at this level of nesting.
          $ref: "#/components/schemas/TextStyle"
        startNumber:
          description: The number of the first list item at this nesting level. A value of 0 is treated as a
            value of 1 for lettered lists and Roman numeral lists. For values of both 0 and 1,
            lettered and Roman numeral lists will begin at `a` and `i` respectively. This value is
            ignored for nesting levels with unordered glyphs.
          format: int32
          type: integer
        glyphType:
          description: The type of glyph used by bullets when paragraphs at this level of nesting is ordered.
            The glyph type determines the type of glyph used to replace placeholders within the
            glyph_format when paragraphs at this level of nesting are ordered. For example, if the
            nesting level is 0, the glyph_format is `%0.` and the glyph type is DECIMAL, then the
            rendered glyph would replace the placeholder `%0` in the glyph format with a number
            corresponding to the list item's order within the list.
          enum:
            - GLYPH_TYPE_UNSPECIFIED
            - NONE
            - DECIMAL
            - ZERO_DECIMAL
            - UPPER_ALPHA
            - ALPHA
            - UPPER_ROMAN
            - ROMAN
          type: string
          enumDescriptions:
            - The glyph type is unspecified or unsupported.
            - An empty string.
            - A number, like `1`, `2`, or `3`.
            - A number where single digit numbers are prefixed with a zero, like `01`, `02`, or
              `03`. Numbers with more than one digit are not prefixed with a zero.
            - An uppercase letter, like `A`, `B`, or `C`.
            - A lowercase letter, like `a`, `b`, or `c`.
            - An uppercase Roman numeral, like `I`, `II`, or `III`.
            - A lowercase Roman numeral, like `i`, `ii`, or `iii`.
        indentFirstLine:
          description: The amount of indentation for the first line of paragraphs at this level of nesting.
          $ref: "#/components/schemas/Dimension"
      type: object
    NestingLevelSuggestionState:
      description: A mask that indicates which of the fields on the base NestingLevel have been changed in
        this suggestion. For any field set to true, there's a new suggested value.
      properties:
        glyphFormatSuggested:
          type: boolean
          description: Indicates if there was a suggested change to glyph_format.
        startNumberSuggested:
          type: boolean
          description: Indicates if there was a suggested change to start_number.
        bulletAlignmentSuggested:
          type: boolean
          description: Indicates if there was a suggested change to bullet_alignment.
        glyphSymbolSuggested:
          description: Indicates if there was a suggested change to glyph_symbol.
          type: boolean
        indentStartSuggested:
          type: boolean
          description: Indicates if there was a suggested change to indent_start.
        indentFirstLineSuggested:
          type: boolean
          description: Indicates if there was a suggested change to indent_first_line.
        glyphTypeSuggested:
          type: boolean
          description: Indicates if there was a suggested change to glyph_type.
        textStyleSuggestionState:
          description: A mask that indicates which of the fields in text style have been changed in this
            suggestion.
          $ref: "#/components/schemas/TextStyleSuggestionState"
      type: object
    ObjectReferences:
      description: A collection of object IDs.
      properties:
        objectIds:
          description: The object IDs.
          type: array
          items:
            type: string
      type: object
    OptionalColor:
      description: A color that can either be fully opaque or fully transparent.
      properties:
        color:
          description: If set, this will be used as an opaque color. If unset, this represents a transparent
            color.
          $ref: "#/components/schemas/Color"
      type: object
    PageBreak:
      description: A ParagraphElement representing a page break. A page break makes the subsequent text
        start at the top of the next page.
      properties:
        suggestedTextStyleChanges:
          description: The suggested text style changes to this PageBreak, keyed by suggestion ID.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
        suggestedInsertionIds:
          items:
            type: string
          description: The suggested insertion IDs. A PageBreak may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          type: array
        suggestedDeletionIds:
          items:
            type: string
          type: array
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
        textStyle:
          description: The text style of this PageBreak. Similar to text content, like text runs and footnote
            references, the text style of a page break can affect content layout as well as the
            styling of text inserted next to it.
          $ref: "#/components/schemas/TextStyle"
      type: object
    Paragraph:
      type: object
      description: A StructuralElement representing a paragraph. A paragraph is a range of content that's
        terminated with a newline character.
      properties:
        elements:
          items:
            $ref: "#/components/schemas/ParagraphElement"
          description: The content of the paragraph, broken down into its component parts.
          type: array
        suggestedBulletChanges:
          description: The suggested changes to this paragraph's bullet.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedBullet"
        suggestedPositionedObjectIds:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ObjectReferences"
          description: The IDs of the positioned objects suggested to be attached to this paragraph, keyed by
            suggestion ID.
        suggestedParagraphStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedParagraphStyle"
          description: The suggested paragraph style changes to this paragraph, keyed by suggestion ID.
        bullet:
          description: The bullet for this paragraph. If not present, the paragraph does not belong to a list.
          $ref: "#/components/schemas/Bullet"
        positionedObjectIds:
          description: The IDs of the positioned objects tethered to this paragraph.
          type: array
          items:
            type: string
        paragraphStyle:
          description: The style of this paragraph.
          $ref: "#/components/schemas/ParagraphStyle"
    ParagraphBorder:
      type: object
      description: A border around a paragraph.
      properties:
        color:
          description: The color of the border.
          $ref: "#/components/schemas/OptionalColor"
        padding:
          description: The padding of the border.
          $ref: "#/components/schemas/Dimension"
        width:
          description: The width of the border.
          $ref: "#/components/schemas/Dimension"
        dashStyle:
          type: string
          description: The dash style of the border.
          enum:
            - DASH_STYLE_UNSPECIFIED
            - SOLID
            - DOT
            - DASH
          enumDescriptions:
            - Unspecified dash style.
            - Solid line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'solid'. This is the
              default dash style.
            - Dotted line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dot'.
            - Dashed line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dash'.
    ParagraphElement:
      type: object
      description: A ParagraphElement describes content within a Paragraph.
      properties:
        startIndex:
          description: The zero-based start index of this paragraph element, in UTF-16 code units.
          format: int32
          type: integer
        pageBreak:
          description: A page break paragraph element.
          $ref: "#/components/schemas/PageBreak"
        horizontalRule:
          description: A horizontal rule paragraph element.
          $ref: "#/components/schemas/HorizontalRule"
        equation:
          description: An equation paragraph element.
          $ref: "#/components/schemas/Equation"
        autoText:
          description: An auto text paragraph element.
          $ref: "#/components/schemas/AutoText"
        richLink:
          description: A paragraph element that links to a Google resource (such as a file in Google Drive, a
            YouTube video, or a Calendar event.)
          $ref: "#/components/schemas/RichLink"
        inlineObjectElement:
          description: An inline object paragraph element.
          $ref: "#/components/schemas/InlineObjectElement"
        columnBreak:
          description: A column break paragraph element.
          $ref: "#/components/schemas/ColumnBreak"
        endIndex:
          description: The zero-base end index of this paragraph element, exclusive, in UTF-16 code units.
          format: int32
          type: integer
        person:
          description: A paragraph element that links to a person or email address.
          $ref: "#/components/schemas/Person"
        textRun:
          description: A text run paragraph element.
          $ref: "#/components/schemas/TextRun"
        dateElement:
          description: A paragraph element that represents a date.
          $ref: "#/components/schemas/DateElement"
        footnoteReference:
          description: A footnote reference paragraph element.
          $ref: "#/components/schemas/FootnoteReference"
    ParagraphStyle:
      type: object
      description: "Styles that apply to a whole paragraph. Inherited paragraph styles are represented as
        unset fields in this message. A paragraph style's parent depends on where the paragraph
        style is defined: * The ParagraphStyle on a Paragraph inherits from the paragraph's
        corresponding named style type. * The ParagraphStyle on a named style inherits from the
        normal text named style. * The ParagraphStyle of the normal text named style inherits from
        the default paragraph style in the Docs editor. * The ParagraphStyle on a Paragraph element
        that's contained in a table may inherit its paragraph style from the table style. If the
        paragraph style does not inherit from a parent, unsetting fields will revert the style to a
        value matching the defaults in the Docs editor."
      properties:
        indentStart:
          description: The amount of indentation for the paragraph on the side that corresponds to the start
            of the text, based on the current paragraph direction. If unset, the value is inherited
            from the parent.
          $ref: "#/components/schemas/Dimension"
        tabStops:
          type: array
          description: A list of the tab stops for this paragraph. The list of tab stops is not inherited.
            This property is read-only.
          items:
            $ref: "#/components/schemas/TabStop"
        borderRight:
          description: The border to the right of this paragraph. If unset, the value is inherited from the
            parent. Paragraph borders cannot be partially updated. When changing a paragraph border,
            the new border must be specified in its entirety.
          $ref: "#/components/schemas/ParagraphBorder"
        headingId:
          description: The heading ID of the paragraph. If empty, then this paragraph is not a heading. This
            property is read-only.
          type: string
        namedStyleType:
          description: The named style type of the paragraph. Since updating the named style type affects
            other properties within ParagraphStyle, the named style type is applied before the other
            properties are updated.
          enum:
            - NAMED_STYLE_TYPE_UNSPECIFIED
            - NORMAL_TEXT
            - TITLE
            - SUBTITLE
            - HEADING_1
            - HEADING_2
            - HEADING_3
            - HEADING_4
            - HEADING_5
            - HEADING_6
          type: string
          enumDescriptions:
            - The type of named style is unspecified.
            - Normal text.
            - Title.
            - Subtitle.
            - Heading 1.
            - Heading 2.
            - Heading 3.
            - Heading 4.
            - Heading 5.
            - Heading 6.
        spacingMode:
          enumDescriptions:
            - The spacing mode is inherited from the parent.
            - Paragraph spacing is always rendered.
            - Paragraph spacing is skipped between list elements.
          type: string
          description: The spacing mode for the paragraph.
          enum:
            - SPACING_MODE_UNSPECIFIED
            - NEVER_COLLAPSE
            - COLLAPSE_LISTS
        alignment:
          description: The text alignment for this paragraph.
          enum:
            - ALIGNMENT_UNSPECIFIED
            - START
            - CENTER
            - END
            - JUSTIFIED
          type: string
          enumDescriptions:
            - The paragraph alignment is inherited from the parent.
            - The paragraph is aligned to the start of the line. Left-aligned for LTR text,
              right-aligned otherwise.
            - The paragraph is centered.
            - The paragraph is aligned to the end of the line. Right-aligned for LTR text,
              left-aligned otherwise.
            - The paragraph is justified.
        lineSpacing:
          type: number
          description: The amount of space between lines, as a percentage of normal, where normal is
            represented as 100.0. If unset, the value is inherited from the parent.
          format: float
        keepWithNext:
          type: boolean
          description: Whether at least a part of this paragraph should be laid out on the same page or column
            as the next paragraph if possible. If unset, the value is inherited from the parent.
        keepLinesTogether:
          description: Whether all lines of the paragraph should be laid out on the same page or column if
            possible. If unset, the value is inherited from the parent.
          type: boolean
        borderBottom:
          description: The border at the bottom of this paragraph. If unset, the value is inherited from the
            parent. The bottom border is rendered when the paragraph below has different border and
            indent properties. Paragraph borders cannot be partially updated. When changing a
            paragraph border, the new border must be specified in its entirety.
          $ref: "#/components/schemas/ParagraphBorder"
        borderTop:
          description: The border at the top of this paragraph. If unset, the value is inherited from the
            parent. The top border is rendered when the paragraph above has different border and
            indent properties. Paragraph borders cannot be partially updated. When changing a
            paragraph border, the new border must be specified in its entirety.
          $ref: "#/components/schemas/ParagraphBorder"
        indentEnd:
          description: The amount of indentation for the paragraph on the side that corresponds to the end of
            the text, based on the current paragraph direction. If unset, the value is inherited
            from the parent.
          $ref: "#/components/schemas/Dimension"
        avoidWidowAndOrphan:
          type: boolean
          description: Whether to avoid widows and orphans for the paragraph. If unset, the value is inherited
            from the parent.
        spaceAbove:
          description: The amount of extra space above the paragraph. If unset, the value is inherited from
            the parent.
          $ref: "#/components/schemas/Dimension"
        spaceBelow:
          description: The amount of extra space below the paragraph. If unset, the value is inherited from
            the parent.
          $ref: "#/components/schemas/Dimension"
        direction:
          enumDescriptions:
            - The content direction is unspecified.
            - The content goes from left to right.
            - The content goes from right to left.
          description: The text direction of this paragraph. If unset, the value defaults to LEFT_TO_RIGHT
            since paragraph direction is not inherited.
          enum:
            - CONTENT_DIRECTION_UNSPECIFIED
            - LEFT_TO_RIGHT
            - RIGHT_TO_LEFT
          type: string
        borderBetween:
          description: The border between this paragraph and the next and previous paragraphs. If unset, the
            value is inherited from the parent. The between border is rendered when the adjacent
            paragraph has the same border and indent properties. Paragraph borders cannot be
            partially updated. When changing a paragraph border, the new border must be specified in
            its entirety.
          $ref: "#/components/schemas/ParagraphBorder"
        indentFirstLine:
          description: The amount of indentation for the first line of the paragraph. If unset, the value is
            inherited from the parent.
          $ref: "#/components/schemas/Dimension"
        shading:
          description: The shading of the paragraph. If unset, the value is inherited from the parent.
          $ref: "#/components/schemas/Shading"
        borderLeft:
          description: The border to the left of this paragraph. If unset, the value is inherited from the
            parent. Paragraph borders cannot be partially updated. When changing a paragraph border,
            the new border must be specified in its entirety.
          $ref: "#/components/schemas/ParagraphBorder"
        pageBreakBefore:
          description: Whether the current paragraph should always start at the beginning of a page. If unset,
            the value is inherited from the parent. Attempting to update page_break_before for
            paragraphs in unsupported regions, including Table, Header, Footer and Footnote, can
            result in an invalid document state that returns a 400 bad request error.
          type: boolean
    ParagraphStyleSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base ParagraphStyle have been changed
        in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        borderRightSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_right.
        borderBetweenSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_between.
        indentStartSuggested:
          description: Indicates if there was a suggested change to indent_start.
          type: boolean
        pageBreakBeforeSuggested:
          description: Indicates if there was a suggested change to page_break_before.
          type: boolean
        spaceAboveSuggested:
          type: boolean
          description: Indicates if there was a suggested change to space_above.
        avoidWidowAndOrphanSuggested:
          description: Indicates if there was a suggested change to avoid_widow_and_orphan.
          type: boolean
        keepWithNextSuggested:
          type: boolean
          description: Indicates if there was a suggested change to keep_with_next.
        lineSpacingSuggested:
          description: Indicates if there was a suggested change to line_spacing.
          type: boolean
        borderBottomSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_bottom.
        shadingSuggestionState:
          description: A mask that indicates which of the fields in shading have been changed in this
            suggestion.
          $ref: "#/components/schemas/ShadingSuggestionState"
        spaceBelowSuggested:
          type: boolean
          description: Indicates if there was a suggested change to space_below.
        namedStyleTypeSuggested:
          description: Indicates if there was a suggested change to named_style_type.
          type: boolean
        directionSuggested:
          type: boolean
          description: Indicates if there was a suggested change to direction.
        keepLinesTogetherSuggested:
          type: boolean
          description: Indicates if there was a suggested change to keep_lines_together.
        borderTopSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_top.
        borderLeftSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_left.
        headingIdSuggested:
          type: boolean
          description: Indicates if there was a suggested change to heading_id.
        alignmentSuggested:
          description: Indicates if there was a suggested change to alignment.
          type: boolean
        spacingModeSuggested:
          type: boolean
          description: Indicates if there was a suggested change to spacing_mode.
        indentFirstLineSuggested:
          type: boolean
          description: Indicates if there was a suggested change to indent_first_line.
        indentEndSuggested:
          type: boolean
          description: Indicates if there was a suggested change to indent_end.
    Person:
      description: A person or email address mentioned in a document. These mentions behave as a single,
        immutable element containing the person's name or email address.
      properties:
        suggestedTextStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
          description: The suggested text style changes to this Person, keyed by suggestion ID.
        personProperties:
          description: Output only. The properties of this Person. This field is always present.
          $ref: "#/components/schemas/PersonProperties"
        personId:
          description: Output only. The unique ID of this link.
          type: string
        textStyle:
          description: The text style of this Person.
          $ref: "#/components/schemas/TextStyle"
        suggestedInsertionIds:
          description: IDs for suggestions that insert this person link into the document. A Person might have
            multiple insertion IDs if it's a nested suggested change (a suggestion within a
            suggestion made by a different user, for example). If empty, then this person link isn't
            a suggested insertion.
          type: array
          items:
            type: string
        suggestedDeletionIds:
          items:
            type: string
          type: array
          description: IDs for suggestions that remove this person link from the document. A Person might have
            multiple deletion IDs if, for example, multiple users suggest deleting it. If empty,
            then this person link isn't suggested for deletion.
      type: object
    PersonProperties:
      description: Properties specific to a linked Person.
      properties:
        email:
          type: string
          description: The email address linked to this Person. This field is always present.
        name:
          description: The name of the person if it's displayed in the link text instead of the person's email
            address.
          type: string
      type: object
    PositionedObject:
      description: An object that's tethered to a Paragraph and positioned relative to the beginning of
        the paragraph. A PositionedObject contains an EmbeddedObject such as an image.
      properties:
        positionedObjectProperties:
          description: The properties of this positioned object.
          $ref: "#/components/schemas/PositionedObjectProperties"
        suggestedInsertionId:
          type: string
          description: The suggested insertion ID. If empty, then this is not a suggested insertion.
        objectId:
          type: string
          description: The ID of this positioned object.
        suggestedPositionedObjectPropertiesChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedPositionedObjectProperties"
          description: The suggested changes to the positioned object properties, keyed by suggestion ID.
        suggestedDeletionIds:
          type: array
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          items:
            type: string
      type: object
    PositionedObjectPositioning:
      description: The positioning of a PositionedObject. The positioned object is positioned relative to
        the beginning of the Paragraph it's tethered to.
      properties:
        leftOffset:
          description: The offset of the left edge of the positioned object relative to the beginning of the
            Paragraph it's tethered to. The exact positioning of the object can depend on other
            content in the document and the document's styling.
          $ref: "#/components/schemas/Dimension"
        layout:
          enumDescriptions:
            - The layout is unspecified.
            - The text wraps around the positioned object.
            - Breaks text such that the positioned object is on the left and text is on the right.
            - Breaks text such that the positioned object is on the right and text is on the left.
            - Breaks text such that there's no text on the left or right of the positioned object.
            - The positioned object is in front of the text.
            - The positioned object is behind the text.
          description: The layout of this positioned object.
          enum:
            - POSITIONED_OBJECT_LAYOUT_UNSPECIFIED
            - WRAP_TEXT
            - BREAK_LEFT
            - BREAK_RIGHT
            - BREAK_LEFT_RIGHT
            - IN_FRONT_OF_TEXT
            - BEHIND_TEXT
          type: string
        topOffset:
          description: The offset of the top edge of the positioned object relative to the beginning of the
            Paragraph it's tethered to. The exact positioning of the object can depend on other
            content in the document and the document's styling.
          $ref: "#/components/schemas/Dimension"
      type: object
    PositionedObjectPositioningSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base PositionedObjectPositioning have
        been changed in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        leftOffsetSuggested:
          type: boolean
          description: Indicates if there was a suggested change to left_offset.
        layoutSuggested:
          description: Indicates if there was a suggested change to layout.
          type: boolean
        topOffsetSuggested:
          description: Indicates if there was a suggested change to top_offset.
          type: boolean
    PositionedObjectProperties:
      description: Properties of a PositionedObject.
      properties:
        positioning:
          description: The positioning of this positioned object relative to the newline of the Paragraph that
            references this positioned object.
          $ref: "#/components/schemas/PositionedObjectPositioning"
        embeddedObject:
          description: The embedded object of this positioned object.
          $ref: "#/components/schemas/EmbeddedObject"
      type: object
    PositionedObjectPropertiesSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base PositionedObjectProperties have
        been changed in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        embeddedObjectSuggestionState:
          description: A mask that indicates which of the fields in embedded_object have been changed in this
            suggestion.
          $ref: "#/components/schemas/EmbeddedObjectSuggestionState"
        positioningSuggestionState:
          description: A mask that indicates which of the fields in positioning have been changed in this
            suggestion.
          $ref: "#/components/schemas/PositionedObjectPositioningSuggestionState"
    Range:
      description: Specifies a contiguous range of text.
      properties:
        endIndex:
          type: integer
          description: The zero-based end index of this range, exclusive, in UTF-16 code units. In all current
            uses, an end index must be provided. This field is an Int32Value in order to accommodate
            future use cases with open-ended ranges.
          format: int32
        tabId:
          description: "The tab that contains this range. When omitted, the request applies to the first tab.
            In a document containing a single tab: - If provided, must match the singular tab's ID.
            - If omitted, the request applies to the singular tab. In a document containing multiple
            tabs: - If provided, the request applies to the specified tab. - If omitted, the request
            applies to the first tab in the document."
          type: string
        startIndex:
          type: integer
          description: The zero-based start index of this range, in UTF-16 code units. In all current uses, a
            start index must be provided. This field is an Int32Value in order to accommodate future
            use cases with open-ended ranges.
          format: int32
        segmentId:
          description: The ID of the header, footer, or footnote that this range is contained in. An empty
            segment ID signifies the document's body.
          type: string
      type: object
    RgbColor:
      description: An RGB color.
      properties:
        green:
          type: number
          description: The green component of the color, from 0.0 to 1.0.
          format: float
        blue:
          description: The blue component of the color, from 0.0 to 1.0.
          format: float
          type: number
        red:
          description: The red component of the color, from 0.0 to 1.0.
          format: float
          type: number
      type: object
    RichLink:
      type: object
      description: A link to a Google resource (such as a file in Drive, a YouTube video, or a Calendar event).
      properties:
        richLinkId:
          type: string
          description: Output only. The ID of this link.
        suggestedInsertionIds:
          items:
            type: string
          type: array
          description: IDs for suggestions that insert this link into the document. A RichLink might have
            multiple insertion IDs if it's a nested suggested change (a suggestion within a
            suggestion made by a different user, for example). If empty, then this person link isn't
            a suggested insertion.
        suggestedDeletionIds:
          items:
            type: string
          description: IDs for suggestions that remove this link from the document. A RichLink might have
            multiple deletion IDs if, for example, multiple users suggest deleting it. If empty,
            then this person link isn't suggested for deletion.
          type: array
        suggestedTextStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
          description: The suggested text style changes to this RichLink, keyed by suggestion ID.
        textStyle:
          description: The text style of this RichLink.
          $ref: "#/components/schemas/TextStyle"
        richLinkProperties:
          description: Output only. The properties of this RichLink. This field is always present.
          $ref: "#/components/schemas/RichLinkProperties"
    RichLinkProperties:
      type: object
      description: Properties specific to a RichLink.
      properties:
        mimeType:
          type: string
          description: The [MIME type](https://developers.google.com/drive/api/v3/mime-types) of the RichLink,
            if there's one (for example, when it's a file in Drive).
        title:
          type: string
          description: The title of the RichLink as displayed in the link. This title matches the title of the
            linked resource at the time of the insertion or last update of the link. This field is
            always present.
        uri:
          description: The URI to the RichLink. This is always present.
          type: string
    SectionBreak:
      type: object
      description: A StructuralElement representing a section break. A section is a range of content that
        has the same SectionStyle. A section break represents the start of a new section, and the
        section style applies to the section after the section break. The document body always
        begins with a section break.
      properties:
        suggestedInsertionIds:
          items:
            type: string
          description: The suggested insertion IDs. A SectionBreak may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          type: array
        suggestedDeletionIds:
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          type: array
          items:
            type: string
        sectionStyle:
          description: The style of the section after this section break.
          $ref: "#/components/schemas/SectionStyle"
    SectionColumnProperties:
      description: Properties that apply to a section's column.
      properties:
        width:
          description: Output only. The width of the column.
          $ref: "#/components/schemas/Dimension"
        paddingEnd:
          description: The padding at the end of the column.
          $ref: "#/components/schemas/Dimension"
      type: object
    SectionStyle:
      description: The styling that applies to a section.
      properties:
        defaultFooterId:
          type: string
          description: The ID of the default footer. If unset, the value inherits from the previous
            SectionBreak's SectionStyle. If the value is unset in the first SectionBreak, it
            inherits from DocumentStyle's default_footer_id. If DocumentMode is PAGELESS, this
            property will not be rendered. This property is read-only.
        firstPageFooterId:
          type: string
          description: The ID of the footer used only for the first page of the section. If
            use_first_page_header_footer is true, this value is used for the footer on the first
            page of the section. If it's false, the footer on the first page of the section uses the
            default_footer_id. If unset, the value inherits from the previous SectionBreak's
            SectionStyle. If the value is unset in the first SectionBreak, it inherits from
            DocumentStyle's first_page_footer_id. If DocumentMode is PAGELESS, this property will
            not be rendered. This property is read-only.
        contentDirection:
          enumDescriptions:
            - The content direction is unspecified.
            - The content goes from left to right.
            - The content goes from right to left.
          type: string
          description: The content direction of this section. If unset, the value defaults to LEFT_TO_RIGHT.
            When updating this property, setting a concrete value is required. Unsetting this
            property results in a 400 bad request error.
          enum:
            - CONTENT_DIRECTION_UNSPECIFIED
            - LEFT_TO_RIGHT
            - RIGHT_TO_LEFT
        firstPageHeaderId:
          description: The ID of the header used only for the first page of the section. If
            use_first_page_header_footer is true, this value is used for the header on the first
            page of the section. If it's false, the header on the first page of the section uses the
            default_header_id. If unset, the value inherits from the previous SectionBreak's
            SectionStyle. If the value is unset in the first SectionBreak, it inherits from
            DocumentStyle's first_page_header_id. If DocumentMode is PAGELESS, this property will
            not be rendered. This property is read-only.
          type: string
        sectionType:
          enumDescriptions:
            - The section type is unspecified.
            - The section starts immediately after the last paragraph of the previous section.
            - The section starts on the next page.
          type: string
          description: Output only. The type of section.
          enum:
            - SECTION_TYPE_UNSPECIFIED
            - CONTINUOUS
            - NEXT_PAGE
        marginFooter:
          description: The footer margin of the section. If unset, the value defaults to margin_footer from
            DocumentStyle. If updated, use_custom_header_footer_margins is set to true on
            DocumentStyle. The value of use_custom_header_footer_margins on DocumentStyle indicates
            if a footer margin is being respected for this section If DocumentMode is PAGELESS, this
            property will not be rendered. When updating this property, setting a concrete value is
            required. Unsetting this property results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
        evenPageFooterId:
          description: The ID of the footer used only for even pages. If the value of DocumentStyle's
            use_even_page_header_footer is true, this value is used for the footers on even pages in
            the section. If it is false, the footers on even pages use the default_footer_id. If
            unset, the value inherits from the previous SectionBreak's SectionStyle. If the value is
            unset in the first SectionBreak, it inherits from DocumentStyle's even_page_footer_id.
            If DocumentMode is PAGELESS, this property will not be rendered. This property is
            read-only.
          type: string
        marginTop:
          description: The top page margin of the section. If unset, the value defaults to margin_top from
            DocumentStyle. If DocumentMode is PAGELESS, this property will not be rendered. When
            updating this property, setting a concrete value is required. Unsetting this property
            results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
        marginLeft:
          description: The left page margin of the section. If unset, the value defaults to margin_left from
            DocumentStyle. Updating the left margin causes columns in this section to resize. Since
            the margin affects column width, it's applied before column properties. If DocumentMode
            is PAGELESS, this property will not be rendered. When updating this property, setting a
            concrete value is required. Unsetting this property results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
        marginHeader:
          description: The header margin of the section. If unset, the value defaults to margin_header from
            DocumentStyle. If updated, use_custom_header_footer_margins is set to true on
            DocumentStyle. The value of use_custom_header_footer_margins on DocumentStyle indicates
            if a header margin is being respected for this section. If DocumentMode is PAGELESS,
            this property will not be rendered. When updating this property, setting a concrete
            value is required. Unsetting this property results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
        columnProperties:
          description: The section's columns properties. If empty, the section contains one column with the
            default properties in the Docs editor. A section can be updated to have no more than 3
            columns. When updating this property, setting a concrete value is required. Unsetting
            this property will result in a 400 bad request error.
          type: array
          items:
            $ref: "#/components/schemas/SectionColumnProperties"
        useFirstPageHeaderFooter:
          type: boolean
          description: Indicates whether to use the first page header / footer IDs for the first page of the
            section. If unset, it inherits from DocumentStyle's use_first_page_header_footer for the
            first section. If the value is unset for subsequent sectors, it should be interpreted as
            false. If DocumentMode is PAGELESS, this property will not be rendered. When updating
            this property, setting a concrete value is required. Unsetting this property results in
            a 400 bad request error.
        marginBottom:
          description: The bottom page margin of the section. If unset, the value defaults to margin_bottom
            from DocumentStyle. If DocumentMode is PAGELESS, this property will not be rendered.
            When updating this property, setting a concrete value is required. Unsetting this
            property results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
        pageNumberStart:
          description: The page number from which to start counting the number of pages for this section. If
            unset, page numbering continues from the previous section. If the value is unset in the
            first SectionBreak, refer to DocumentStyle's page_number_start. If DocumentMode is
            PAGELESS, this property will not be rendered. When updating this property, setting a
            concrete value is required. Unsetting this property results in a 400 bad request error.
          format: int32
          type: integer
        columnSeparatorStyle:
          type: string
          description: The style of column separators. This style can be set even when there's one column in
            the section. When updating this property, setting a concrete value is required.
            Unsetting this property results in a 400 bad request error.
          enum:
            - COLUMN_SEPARATOR_STYLE_UNSPECIFIED
            - NONE
            - BETWEEN_EACH_COLUMN
          enumDescriptions:
            - An unspecified column separator style.
            - No column separator lines between columns.
            - Renders a column separator line between each column.
        defaultHeaderId:
          type: string
          description: The ID of the default header. If unset, the value inherits from the previous
            SectionBreak's SectionStyle. If the value is unset in the first SectionBreak, it
            inherits from DocumentStyle's default_header_id. If DocumentMode is PAGELESS, this
            property will not be rendered. This property is read-only.
        evenPageHeaderId:
          description: The ID of the header used only for even pages. If the value of DocumentStyle's
            use_even_page_header_footer is true, this value is used for the headers on even pages in
            the section. If it is false, the headers on even pages use the default_header_id. If
            unset, the value inherits from the previous SectionBreak's SectionStyle. If the value is
            unset in the first SectionBreak, it inherits from DocumentStyle's even_page_header_id.
            If DocumentMode is PAGELESS, this property will not be rendered. This property is
            read-only.
          type: string
        flipPageOrientation:
          type: boolean
          description: Optional. Indicates whether to flip the dimensions of DocumentStyle's page_size for
            this section, which allows changing the page orientation between portrait and landscape.
            If unset, the value inherits from DocumentStyle's flip_page_orientation. If DocumentMode
            is PAGELESS, this property will not be rendered. When updating this property, setting a
            concrete value is required. Unsetting this property results in a 400 bad request error.
        marginRight:
          description: The right page margin of the section. If unset, the value defaults to margin_right from
            DocumentStyle. Updating the right margin causes columns in this section to resize. Since
            the margin affects column width, it's applied before column properties. If DocumentMode
            is PAGELESS, this property will not be rendered. When updating this property, setting a
            concrete value is required. Unsetting this property results in a 400 bad request error.
          $ref: "#/components/schemas/Dimension"
      type: object
    Shading:
      description: The shading of a paragraph.
      properties:
        backgroundColor:
          description: The background color of this paragraph shading.
          $ref: "#/components/schemas/OptionalColor"
      type: object
    ShadingSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base Shading have been changed in this
        suggested change. For any field set to true, there's a new suggested value.
      properties:
        backgroundColorSuggested:
          type: boolean
          description: Indicates if there was a suggested change to the Shading.
    SheetsChartReference:
      description: A reference to a linked chart embedded from Google Sheets.
      properties:
        spreadsheetId:
          type: string
          description: The ID of the Google Sheets spreadsheet that contains the source chart.
        chartId:
          type: integer
          description: The ID of the specific chart in the Google Sheets spreadsheet that's embedded.
          format: int32
      type: object
    SheetsChartReferenceSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base SheetsChartReference have been
        changed in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        spreadsheetIdSuggested:
          description: Indicates if there was a suggested change to spreadsheet_id.
          type: boolean
        chartIdSuggested:
          type: boolean
          description: Indicates if there was a suggested change to chart_id.
    Size:
      type: object
      description: A width and height.
      properties:
        width:
          description: The width of the object.
          $ref: "#/components/schemas/Dimension"
        height:
          description: The height of the object.
          $ref: "#/components/schemas/Dimension"
    SizeSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base Size have been changed in this
        suggestion. For any field set to true, the Size has a new suggested value.
      properties:
        heightSuggested:
          description: Indicates if there was a suggested change to height.
          type: boolean
        widthSuggested:
          type: boolean
          description: Indicates if there was a suggested change to width.
    StructuralElement:
      description: A StructuralElement describes content that provides structure to the document.
      properties:
        startIndex:
          description: The zero-based start index of this structural element, in UTF-16 code units.
          format: int32
          type: integer
        paragraph:
          description: A paragraph type of structural element.
          $ref: "#/components/schemas/Paragraph"
        table:
          description: A table type of structural element.
          $ref: "#/components/schemas/Table"
        endIndex:
          description: The zero-based end index of this structural element, exclusive, in UTF-16 code units.
          format: int32
          type: integer
        tableOfContents:
          description: A table of contents type of structural element.
          $ref: "#/components/schemas/TableOfContents"
        sectionBreak:
          description: A section break type of structural element.
          $ref: "#/components/schemas/SectionBreak"
      type: object
    SuggestedBullet:
      description: A suggested change to a Bullet.
      properties:
        bulletSuggestionState:
          description: A mask that indicates which of the fields on the base Bullet have been changed in this
            suggestion.
          $ref: "#/components/schemas/BulletSuggestionState"
        bullet:
          description: A Bullet that only includes the changes made in this suggestion. This can be used along
            with the bullet_suggestion_state to see which fields have changed and their new values.
          $ref: "#/components/schemas/Bullet"
      type: object
    SuggestedDateElementProperties:
      type: object
      description: A suggested change to a DateElementProperties.
      properties:
        dateElementProperties:
          description: DateElementProperties that only includes the changes made in this suggestion. This can
            be used along with the date_element_properties_suggestion_state to see which fields have
            changed and their new values.
          $ref: "#/components/schemas/DateElementProperties"
        dateElementPropertiesSuggestionState:
          description: A mask that indicates which of the fields on the base DateElementProperties have been
            changed in this suggestion.
          $ref: "#/components/schemas/DateElementPropertiesSuggestionState"
    SuggestedDocumentStyle:
      description: A suggested change to the DocumentStyle.
      properties:
        documentStyle:
          description: A DocumentStyle that only includes the changes made in this suggestion. This can be
            used along with the document_style_suggestion_state to see which fields have changed and
            their new values.
          $ref: "#/components/schemas/DocumentStyle"
        documentStyleSuggestionState:
          description: A mask that indicates which of the fields on the base DocumentStyle have been changed
            in this suggestion.
          $ref: "#/components/schemas/DocumentStyleSuggestionState"
      type: object
    SuggestedInlineObjectProperties:
      type: object
      description: A suggested change to InlineObjectProperties.
      properties:
        inlineObjectProperties:
          description: An InlineObjectProperties that only includes the changes made in this suggestion. This
            can be used along with the inline_object_properties_suggestion_state to see which fields
            have changed and their new values.
          $ref: "#/components/schemas/InlineObjectProperties"
        inlineObjectPropertiesSuggestionState:
          description: A mask that indicates which of the fields on the base InlineObjectProperties have been
            changed in this suggestion.
          $ref: "#/components/schemas/InlineObjectPropertiesSuggestionState"
    SuggestedListProperties:
      type: object
      description: A suggested change to ListProperties.
      properties:
        listProperties:
          description: A ListProperties that only includes the changes made in this suggestion. This can be
            used along with the list_properties_suggestion_state to see which fields have changed
            and their new values.
          $ref: "#/components/schemas/ListProperties"
        listPropertiesSuggestionState:
          description: A mask that indicates which of the fields on the base ListProperties have been changed
            in this suggestion.
          $ref: "#/components/schemas/ListPropertiesSuggestionState"
    SuggestedNamedStyles:
      type: object
      description: A suggested change to the NamedStyles.
      properties:
        namedStylesSuggestionState:
          description: A mask that indicates which of the fields on the base NamedStyles have been changed in
            this suggestion.
          $ref: "#/components/schemas/NamedStylesSuggestionState"
        namedStyles:
          description: A NamedStyles that only includes the changes made in this suggestion. This can be used
            along with the named_styles_suggestion_state to see which fields have changed and their
            new values.
          $ref: "#/components/schemas/NamedStyles"
    SuggestedParagraphStyle:
      type: object
      description: A suggested change to a ParagraphStyle.
      properties:
        paragraphStyle:
          description: A ParagraphStyle that only includes the changes made in this suggestion. This can be
            used along with the paragraph_style_suggestion_state to see which fields have changed
            and their new values.
          $ref: "#/components/schemas/ParagraphStyle"
        paragraphStyleSuggestionState:
          description: A mask that indicates which of the fields on the base ParagraphStyle have been changed
            in this suggestion.
          $ref: "#/components/schemas/ParagraphStyleSuggestionState"
    SuggestedPositionedObjectProperties:
      type: object
      description: A suggested change to PositionedObjectProperties.
      properties:
        positionedObjectProperties:
          description: A PositionedObjectProperties that only includes the changes made in this suggestion.
            This can be used along with the positioned_object_properties_suggestion_state to see
            which fields have changed and their new values.
          $ref: "#/components/schemas/PositionedObjectProperties"
        positionedObjectPropertiesSuggestionState:
          description: A mask that indicates which of the fields on the base PositionedObjectProperties have
            been changed in this suggestion.
          $ref: "#/components/schemas/PositionedObjectPropertiesSuggestionState"
    SuggestedTableCellStyle:
      type: object
      description: A suggested change to a TableCellStyle.
      properties:
        tableCellStyle:
          description: A TableCellStyle that only includes the changes made in this suggestion. This can be
            used along with the table_cell_style_suggestion_state to see which fields have changed
            and their new values.
          $ref: "#/components/schemas/TableCellStyle"
        tableCellStyleSuggestionState:
          description: A mask that indicates which of the fields on the base TableCellStyle have been changed
            in this suggestion.
          $ref: "#/components/schemas/TableCellStyleSuggestionState"
    SuggestedTableRowStyle:
      type: object
      description: A suggested change to a TableRowStyle.
      properties:
        tableRowStyle:
          description: A TableRowStyle that only includes the changes made in this suggestion. This can be
            used along with the table_row_style_suggestion_state to see which fields have changed
            and their new values.
          $ref: "#/components/schemas/TableRowStyle"
        tableRowStyleSuggestionState:
          description: A mask that indicates which of the fields on the base TableRowStyle have been changed
            in this suggestion.
          $ref: "#/components/schemas/TableRowStyleSuggestionState"
    SuggestedTextStyle:
      type: object
      description: A suggested change to a TextStyle.
      properties:
        textStyleSuggestionState:
          description: A mask that indicates which of the fields on the base TextStyle have been changed in
            this suggestion.
          $ref: "#/components/schemas/TextStyleSuggestionState"
        textStyle:
          description: A TextStyle that only includes the changes made in this suggestion. This can be used
            along with the text_style_suggestion_state to see which fields have changed and their
            new values.
          $ref: "#/components/schemas/TextStyle"
    Tab:
      type: object
      description: A tab in a document.
      properties:
        childTabs:
          items:
            $ref: "#/components/schemas/Tab"
          type: array
          description: The child tabs nested within this tab.
        tabProperties:
          description: The properties of the tab, like ID and title.
          $ref: "#/components/schemas/TabProperties"
        documentTab:
          description: A tab with document contents, like text and images.
          $ref: "#/components/schemas/DocumentTab"
    TabProperties:
      type: object
      description: Properties of a tab.
      properties:
        iconEmoji:
          description: Optional. The emoji icon displayed with the tab. A valid emoji icon is represented by a
            non-empty Unicode string. Any set of characters that don't represent a single emoji is
            invalid. If an emoji is invalid, a 400 bad request error is returned. If this value is
            unset or empty, the tab will display the default tab icon.
          type: string
        index:
          description: The zero-based index of the tab within the parent.
          format: int32
          type: integer
        title:
          type: string
          description: The user-visible name of the tab.
        parentTabId:
          type: string
          description: Optional. The ID of the parent tab. Empty when the current tab is a root-level tab,
            which means it doesn't have any parents.
        tabId:
          type: string
          description: The immutable ID of the tab.
        nestingLevel:
          description: Output only. The depth of the tab within the document. Root-level tabs start at 0.
          format: int32
          type: integer
    TabStop:
      type: object
      description: A tab stop within a paragraph.
      properties:
        alignment:
          enumDescriptions:
            - The tab stop alignment is unspecified.
            - The tab stop is aligned to the start of the line. This is the default.
            - The tab stop is aligned to the center of the line.
            - The tab stop is aligned to the end of the line.
          description: The alignment of this tab stop. If unset, the value defaults to START.
          enum:
            - TAB_STOP_ALIGNMENT_UNSPECIFIED
            - START
            - CENTER
            - END
          type: string
        offset:
          description: The offset between this tab stop and the start margin.
          $ref: "#/components/schemas/Dimension"
    Table:
      type: object
      description: A StructuralElement representing a table.
      properties:
        suggestedInsertionIds:
          type: array
          description: The suggested insertion IDs. A Table may have multiple insertion IDs if it's a nested
            suggested change. If empty, then this is not a suggested insertion.
          items:
            type: string
        suggestedDeletionIds:
          items:
            type: string
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          type: array
        tableRows:
          type: array
          description: The contents and style of each row.
          items:
            $ref: "#/components/schemas/TableRow"
        tableStyle:
          description: The style of the table.
          $ref: "#/components/schemas/TableStyle"
        rows:
          description: Number of rows in the table.
          format: int32
          type: integer
        columns:
          description: Number of columns in the table. It's possible for a table to be non-rectangular, so
            some rows may have a different number of cells.
          format: int32
          type: integer
    TableCell:
      type: object
      description: The contents and style of a cell in a Table.
      properties:
        tableCellStyle:
          description: The style of the cell.
          $ref: "#/components/schemas/TableCellStyle"
        suggestedInsertionIds:
          type: array
          description: The suggested insertion IDs. A TableCell may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          items:
            type: string
        suggestedDeletionIds:
          type: array
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          items:
            type: string
        endIndex:
          description: The zero-based end index of this cell, exclusive, in UTF-16 code units.
          format: int32
          type: integer
        startIndex:
          type: integer
          description: The zero-based start index of this cell, in UTF-16 code units.
          format: int32
        content:
          type: array
          description: The content of the cell.
          items:
            $ref: "#/components/schemas/StructuralElement"
        suggestedTableCellStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTableCellStyle"
          description: The suggested changes to the table cell style, keyed by suggestion ID.
    TableCellBorder:
      type: object
      description: A border around a table cell. Table cell borders cannot be transparent. To hide a table
        cell border, make its width 0.
      properties:
        color:
          description: The color of the border. This color cannot be transparent.
          $ref: "#/components/schemas/OptionalColor"
        width:
          description: The width of the border.
          $ref: "#/components/schemas/Dimension"
        dashStyle:
          enumDescriptions:
            - Unspecified dash style.
            - Solid line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'solid'. This is the
              default dash style.
            - Dotted line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dot'.
            - Dashed line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dash'.
          description: The dash style of the border.
          enum:
            - DASH_STYLE_UNSPECIFIED
            - SOLID
            - DOT
            - DASH
          type: string
    TableCellStyle:
      type: object
      description: The style of a TableCell. Inherited table cell styles are represented as unset fields
        in this message. A table cell style can inherit from the table's style.
      properties:
        contentAlignment:
          enumDescriptions:
            - An unspecified content alignment. The content alignment is inherited from the parent
              if one exists.
            - An unsupported content alignment.
            - An alignment that aligns the content to the top of the content holder. Corresponds to
              ECMA-376 ST_TextAnchoringType 't'.
            - An alignment that aligns the content to the middle of the content holder. Corresponds
              to ECMA-376 ST_TextAnchoringType 'ctr'.
            - An alignment that aligns the content to the bottom of the content holder. Corresponds
              to ECMA-376 ST_TextAnchoringType 'b'.
          description: The alignment of the content in the table cell. The default alignment matches the
            alignment for newly created table cells in the Docs editor.
          enum:
            - CONTENT_ALIGNMENT_UNSPECIFIED
            - CONTENT_ALIGNMENT_UNSUPPORTED
            - TOP
            - MIDDLE
            - BOTTOM
          type: string
        borderRight:
          description: The right border of the cell.
          $ref: "#/components/schemas/TableCellBorder"
        paddingLeft:
          description: The left padding of the cell.
          $ref: "#/components/schemas/Dimension"
        paddingBottom:
          description: The bottom padding of the cell.
          $ref: "#/components/schemas/Dimension"
        columnSpan:
          description: The column span of the cell. This property is read-only.
          format: int32
          type: integer
        borderLeft:
          description: The left border of the cell.
          $ref: "#/components/schemas/TableCellBorder"
        borderTop:
          description: The top border of the cell.
          $ref: "#/components/schemas/TableCellBorder"
        backgroundColor:
          description: The background color of the cell.
          $ref: "#/components/schemas/OptionalColor"
        borderBottom:
          description: The bottom border of the cell.
          $ref: "#/components/schemas/TableCellBorder"
        paddingRight:
          description: The right padding of the cell.
          $ref: "#/components/schemas/Dimension"
        paddingTop:
          description: The top padding of the cell.
          $ref: "#/components/schemas/Dimension"
        rowSpan:
          description: The row span of the cell. This property is read-only.
          format: int32
          type: integer
    TableCellStyleSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base TableCellStyle have been changed
        in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        columnSpanSuggested:
          type: boolean
          description: Indicates if there was a suggested change to column_span.
        backgroundColorSuggested:
          description: Indicates if there was a suggested change to background_color.
          type: boolean
        paddingBottomSuggested:
          type: boolean
          description: Indicates if there was a suggested change to padding_bottom.
        contentAlignmentSuggested:
          description: Indicates if there was a suggested change to content_alignment.
          type: boolean
        rowSpanSuggested:
          type: boolean
          description: Indicates if there was a suggested change to row_span.
        paddingTopSuggested:
          description: Indicates if there was a suggested change to padding_top.
          type: boolean
        borderLeftSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_left.
        borderTopSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_top.
        paddingLeftSuggested:
          description: Indicates if there was a suggested change to padding_left.
          type: boolean
        borderBottomSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_bottom.
        paddingRightSuggested:
          description: Indicates if there was a suggested change to padding_right.
          type: boolean
        borderRightSuggested:
          type: boolean
          description: Indicates if there was a suggested change to border_right.
    TableColumnProperties:
      type: object
      description: The properties of a column in a table.
      properties:
        widthType:
          type: string
          description: The width type of the column.
          enum:
            - WIDTH_TYPE_UNSPECIFIED
            - EVENLY_DISTRIBUTED
            - FIXED_WIDTH
          enumDescriptions:
            - The column width type is unspecified.
            - The column width is evenly distributed among the other evenly distributed columns. The
              width of the column is automatically determined and will have an equal portion of the
              width remaining for the table after accounting for all columns with specified widths.
            - A fixed column width. The width property contains the column's width.
        width:
          description: The width of the column. Set when the column's `width_type` is FIXED_WIDTH.
          $ref: "#/components/schemas/Dimension"
    TableOfContents:
      description: A StructuralElement representing a table of contents.
      properties:
        content:
          type: array
          description: The content of the table of contents.
          items:
            $ref: "#/components/schemas/StructuralElement"
        suggestedInsertionIds:
          items:
            type: string
          type: array
          description: The suggested insertion IDs. A TableOfContents may have multiple insertion IDs if it is
            a nested suggested change. If empty, then this is not a suggested insertion.
        suggestedDeletionIds:
          items:
            type: string
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          type: array
      type: object
    TableRow:
      type: object
      description: The contents and style of a row in a Table.
      properties:
        suggestedInsertionIds:
          items:
            type: string
          description: The suggested insertion IDs. A TableRow may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          type: array
        suggestedDeletionIds:
          items:
            type: string
          type: array
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
        tableCells:
          description: The contents and style of each cell in this row. It's possible for a table to be
            non-rectangular, so some rows may have a different number of cells than other rows in
            the same table.
          type: array
          items:
            $ref: "#/components/schemas/TableCell"
        endIndex:
          description: The zero-based end index of this row, exclusive, in UTF-16 code units.
          format: int32
          type: integer
        startIndex:
          description: The zero-based start index of this row, in UTF-16 code units.
          format: int32
          type: integer
        tableRowStyle:
          description: The style of the table row.
          $ref: "#/components/schemas/TableRowStyle"
        suggestedTableRowStyleChanges:
          description: The suggested style changes to this row, keyed by suggestion ID.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTableRowStyle"
    TableRowStyle:
      description: Styles that apply to a table row.
      properties:
        tableHeader:
          type: boolean
          description: Whether the row is a table header.
        minRowHeight:
          description: The minimum height of the row. The row will be rendered in the Docs editor at a height
            equal to or greater than this value in order to show all the content in the row's cells.
          $ref: "#/components/schemas/Dimension"
        preventOverflow:
          type: boolean
          description: Whether the row cannot overflow across page or column boundaries.
      type: object
    TableRowStyleSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base TableRowStyle have been changed
        in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        minRowHeightSuggested:
          type: boolean
          description: Indicates if there was a suggested change to min_row_height.
    TableStyle:
      description: Styles that apply to a table.
      properties:
        tableColumnProperties:
          type: array
          description: The properties of each column. Note that in Docs, tables contain rows and rows contain
            cells, similar to HTML. So the properties for a row can be found on the row's
            table_row_style.
          items:
            $ref: "#/components/schemas/TableColumnProperties"
      type: object
    TextRun:
      description: A ParagraphElement that represents a run of text that all has the same styling.
      properties:
        content:
          description: The text of this run. Any non-text elements in the run are replaced with the Unicode
            character U+E907.
          type: string
        suggestedTextStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
          description: The suggested text style changes to this run, keyed by suggestion ID.
        textStyle:
          description: The text style of this run.
          $ref: "#/components/schemas/TextStyle"
        suggestedInsertionIds:
          type: array
          description: The suggested insertion IDs. A TextRun may have multiple insertion IDs if it's a nested
            suggested change. If empty, then this is not a suggested insertion.
          items:
            type: string
        suggestedDeletionIds:
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          type: array
          items:
            type: string
      type: object
    TextStyle:
      description: "Represents the styling that can be applied to text. Inherited text styles are
        represented as unset fields in this message. A text style's parent depends on where the text
        style is defined: * The TextStyle of text in a Paragraph inherits from the paragraph's
        corresponding named style type. * The TextStyle on a named style inherits from the normal
        text named style. * The TextStyle of the normal text named style inherits from the default
        text style in the Docs editor. * The TextStyle on a Paragraph element that's contained in a
        table may inherit its text style from the table style. If the text style does not inherit
        from a parent, unsetting fields will revert the style to a value matching the defaults in
        the Docs editor."
      properties:
        backgroundColor:
          description: The background color of the text. If set, the color is either an RGB color or
            transparent, depending on the `color` field.
          $ref: "#/components/schemas/OptionalColor"
        baselineOffset:
          enumDescriptions:
            - The text's baseline offset is inherited from the parent.
            - The text is not vertically offset.
            - The text is vertically offset upwards (superscript).
            - The text is vertically offset downwards (subscript).
          type: string
          description: The text's vertical offset from its normal position. Text with `SUPERSCRIPT` or
            `SUBSCRIPT` baseline offsets is automatically rendered in a smaller font size, computed
            based on the `font_size` field. Changes in this field don't affect the `font_size`.
          enum:
            - BASELINE_OFFSET_UNSPECIFIED
            - NONE
            - SUPERSCRIPT
            - SUBSCRIPT
        underline:
          description: Whether or not the text is underlined.
          type: boolean
        link:
          description: "The hyperlink destination of the text. If unset, there's no link. Links are not
            inherited from parent text. Changing the link in an update request causes some other
            changes to the text style of the range: * When setting a link, the text foreground color
            will be updated to the default link color and the text will be underlined. If these
            fields are modified in the same request, those values will be used instead of the link
            defaults. * Setting a link on a text range that overlaps with an existing link will also
            update the existing link to point to the new URL. * Links are not settable on newline
            characters. As a result, setting a link on a text range that crosses a paragraph
            boundary, such as `\"ABC\\n123\"`, will separate the newline character(s) into their own
            text runs. The link will be applied separately to the runs before and after the newline.
            * Removing a link will update the text style of the range to match the style of the
            preceding text (or the default text styles if the preceding text is another link) unless
            different styles are being set in the same request."
          $ref: "#/components/schemas/Link"
        fontSize:
          description: The size of the text's font.
          $ref: "#/components/schemas/Dimension"
        bold:
          type: boolean
          description: Whether or not the text is rendered as bold.
        strikethrough:
          description: Whether or not the text is struck through.
          type: boolean
        smallCaps:
          type: boolean
          description: Whether or not the text is in small capital letters.
        foregroundColor:
          description: The foreground color of the text. If set, the color is either an RGB color or
            transparent, depending on the `color` field.
          $ref: "#/components/schemas/OptionalColor"
        italic:
          description: Whether or not the text is italicized.
          type: boolean
        weightedFontFamily:
          description: The font family and rendered weight of the text. If an update request specifies values
            for both `weighted_font_family` and `bold`, the `weighted_font_family` is applied first,
            then `bold`. If `weighted_font_family#weight` is not set, it defaults to `400`. If
            `weighted_font_family` is set, then `weighted_font_family#font_family` must also be set
            with a non-empty value. Otherwise, a 400 bad request error is returned.
          $ref: "#/components/schemas/WeightedFontFamily"
      type: object
    TextStyleSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base TextStyle have been changed in
        this suggestion. For any field set to true, there's a new suggested value.
      properties:
        fontSizeSuggested:
          type: boolean
          description: Indicates if there was a suggested change to font_size.
        smallCapsSuggested:
          type: boolean
          description: Indicates if there was a suggested change to small_caps.
        foregroundColorSuggested:
          type: boolean
          description: Indicates if there was a suggested change to foreground_color.
        underlineSuggested:
          description: Indicates if there was a suggested change to underline.
          type: boolean
        weightedFontFamilySuggested:
          type: boolean
          description: Indicates if there was a suggested change to weighted_font_family.
        boldSuggested:
          type: boolean
          description: Indicates if there was a suggested change to bold.
        italicSuggested:
          type: boolean
          description: Indicates if there was a suggested change to italic.
        backgroundColorSuggested:
          description: Indicates if there was a suggested change to background_color.
          type: boolean
        strikethroughSuggested:
          type: boolean
          description: Indicates if there was a suggested change to strikethrough.
        baselineOffsetSuggested:
          description: Indicates if there was a suggested change to baseline_offset.
          type: boolean
        linkSuggested:
          description: Indicates if there was a suggested change to link.
          type: boolean
    WeightedFontFamily:
      type: object
      description: Represents a font family and weight of text.
      properties:
        fontFamily:
          type: string
          description: The font family of the text. The font family can be any font from the Font menu in Docs
            or from [Google Fonts] (https://fonts.google.com/). If the font name is unrecognized,
            the text is rendered in `Arial`.
        weight:
          type: integer
          description: "The weight of the font. This field can have any value that's a multiple of `100`
            between `100` and `900`, inclusive. This range corresponds to the numerical values
            described in the CSS 2.1 Specification, [section
            15.6](https://www.w3.org/TR/CSS21/fonts.html#font-boldness), with non-numerical values
            disallowed. The default value is `400` (\"normal\"). The font weight makes up just one
            component of the rendered font weight. A combination of the `weight` and the text
            style's resolved `bold` value determine the rendered weight, after accounting for
            inheritance: * If the text is bold and the weight is less than `400`, the rendered
            weight is 400. * If the text is bold and the weight is greater than or equal to `400`
            but is less than `700`, the rendered weight is `700`. * If the weight is greater than or
            equal to `700`, the rendered weight is equal to the weight. * If the text is not bold,
            the rendered weight is equal to the weight."
          format: int32
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/documents: https://www.googleapis.com/auth/documents
            https://www.googleapis.com/auth/documents.readonly: https://www.googleapis.com/auth/documents.readonly
            https://www.googleapis.com/auth/drive: https://www.googleapis.com/auth/drive
            https://www.googleapis.com/auth/drive.file: https://www.googleapis.com/auth/drive.file
            https://www.googleapis.com/auth/drive.readonly: https://www.googleapis.com/auth/drive.readonly

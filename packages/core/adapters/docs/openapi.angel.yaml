openapi: 3.0.3
info:
  title: Google Docs API — narrowed for the docs adapter
  version: v1
  description: Tree-shaken to the 1 reviewed docs adapter operation. Generated from the
    Google Docs discovery document — do not edit by hand.
servers:
  - url: https://docs.googleapis.com
paths:
  /v1/documents/{documentId}:
    get:
      operationId: docs.documents.get
      description: Gets the latest version of the specified document.
      parameters:
        - name: suggestionsViewMode
          in: query
          required: false
          description: The suggestions view mode to apply to the document. This allows viewing the document
            with all suggestions inline, accepted or rejected. If one is not specified,
            DEFAULT_FOR_CURRENT_ACCESS is used.
          schema:
            type: string
            enum:
              - DEFAULT_FOR_CURRENT_ACCESS
              - SUGGESTIONS_INLINE
              - PREVIEW_SUGGESTIONS_ACCEPTED
              - PREVIEW_WITHOUT_SUGGESTIONS
            enumDescriptions:
              - The SuggestionsViewMode applied to the returned document depends on the user's
                current access level. If the user only has view access, PREVIEW_WITHOUT_SUGGESTIONS
                is applied. Otherwise, SUGGESTIONS_INLINE is applied. This is the default
                suggestions view mode.
              - The returned document has suggestions inline. Suggested changes will be
                differentiated from base content within the document. Requests to retrieve a
                document using this mode will return a 403 error if the user does not have
                permission to view suggested changes.
              - The returned document is a preview with all suggested changes accepted. Requests to
                retrieve a document using this mode will return a 403 error if the user does not
                have permission to view suggested changes.
              - The returned document is a preview with all suggested changes rejected if there are
                any suggestions in the document.
            description: The suggestions view mode to apply to the document. This allows viewing the document
              with all suggestions inline, accepted or rejected. If one is not specified,
              DEFAULT_FOR_CURRENT_ACCESS is used.
        - name: includeTabsContent
          in: query
          required: false
          description: "Whether to populate the Document.tabs field instead of the text content fields like
            `body` and `documentStyle` on Document. - When `True`: Document content populates in the
            Document.tabs field instead of the text content fields in Document. - When `False`: The
            content of the document's first tab populates the content fields in Document excluding
            Document.tabs. If a document has only one tab, then that tab is used to populate the
            document content. Document.tabs will be empty."
          schema:
            type: boolean
            description: "Whether to populate the Document.tabs field instead of the text content fields like
              `body` and `documentStyle` on Document. - When `True`: Document content populates in
              the Document.tabs field instead of the text content fields in Document. - When
              `False`: The content of the document's first tab populates the content fields in
              Document excluding Document.tabs. If a document has only one tab, then that tab is
              used to populate the document content. Document.tabs will be empty."
        - name: documentId
          in: path
          required: true
          description: The ID of the document to retrieve.
          schema:
            description: The ID of the document to retrieve.
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
      security:
        - oauth2:
            - https://www.googleapis.com/auth/documents
            - https://www.googleapis.com/auth/documents.readonly
            - https://www.googleapis.com/auth/drive
            - https://www.googleapis.com/auth/drive.file
            - https://www.googleapis.com/auth/drive.readonly
      x-executor-toolPath: docs.documents.get
components:
  schemas:
    AutoText:
      type: object
      description: A ParagraphElement representing a spot in the text that's dynamically replaced with
        content that can change over time, like a page number.
      properties:
        suggestedTextStyleChanges:
          description: The suggested text style changes to this AutoText, keyed by suggestion ID.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
        textStyle:
          description: The text style of this AutoText.
          $ref: "#/components/schemas/TextStyle"
        type:
          type: string
          description: The type of this auto text.
          enum:
            - TYPE_UNSPECIFIED
            - PAGE_NUMBER
            - PAGE_COUNT
          enumDescriptions:
            - An unspecified auto text type.
            - Type for auto text that represents the current page number.
            - Type for auto text that represents the total number of pages in the document.
        suggestedInsertionIds:
          type: array
          description: The suggested insertion IDs. An AutoText may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          items:
            type: string
        suggestedDeletionIds:
          items:
            type: string
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
          type: array
    Background:
      description: Represents the background of a document.
      properties:
        color:
          description: The background color.
          $ref: "#/components/schemas/OptionalColor"
      type: object
    BackgroundSuggestionState:
      description: A mask that indicates which of the fields on the base Background have been changed in
        this suggestion. For any field set to true, the Backgound has a new suggested value.
      properties:
        backgroundColorSuggested:
          description: Indicates whether the current background color has been modified in this suggestion.
          type: boolean
      type: object
    Body:
      type: object
      description: The document body. The body typically contains the full document contents except for
        headers, footers, and footnotes.
      properties:
        content:
          items:
            $ref: "#/components/schemas/StructuralElement"
          description: The contents of the body. The indexes for the body's content begin at zero.
          type: array
    BookmarkLink:
      description: A reference to a bookmark in this document.
      properties:
        tabId:
          type: string
          description: The ID of the tab containing this bookmark.
      type: object
    Bullet:
      description: Describes the bullet of a paragraph.
      properties:
        listId:
          type: string
          description: The ID of the list this paragraph belongs to.
        textStyle:
          description: The paragraph-specific text style applied to this bullet.
          $ref: "#/components/schemas/TextStyle"
        nestingLevel:
          description: The nesting level of this paragraph in the list.
          format: int32
          type: integer
      type: object
    BulletSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base Bullet have been changed in this
        suggestion. For any field set to true, there's a new suggested value.
      properties:
        listIdSuggested:
          type: boolean
          description: Indicates if there was a suggested change to the list_id.
        nestingLevelSuggested:
          type: boolean
          description: Indicates if there was a suggested change to the nesting_level.
        textStyleSuggestionState:
          description: A mask that indicates which of the fields in text style have been changed in this
            suggestion.
          $ref: "#/components/schemas/TextStyleSuggestionState"
    Color:
      description: A solid color.
      properties:
        rgbColor:
          description: The RGB color value.
          $ref: "#/components/schemas/RgbColor"
      type: object
    ColumnBreak:
      type: object
      description: A ParagraphElement representing a column break. A column break makes the subsequent
        text start at the top of the next column.
      properties:
        textStyle:
          description: The text style of this ColumnBreak. Similar to text content, like text runs and
            footnote references, the text style of a column break can affect content layout as well
            as the styling of text inserted next to it.
          $ref: "#/components/schemas/TextStyle"
        suggestedInsertionIds:
          items:
            type: string
          description: The suggested insertion IDs. A ColumnBreak may have multiple insertion IDs if it's a
            nested suggested change. If empty, then this is not a suggested insertion.
          type: array
        suggestedDeletionIds:
          items:
            type: string
          type: array
          description: The suggested deletion IDs. If empty, then there are no suggested deletions of this
            content.
        suggestedTextStyleChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
          description: The suggested text style changes to this ColumnBreak, keyed by suggestion ID.
    CropProperties:
      type: object
      description: The crop properties of an image. The crop rectangle is represented using fractional
        offsets from the original content's 4 edges. - If the offset is in the interval (0, 1), the
        corresponding edge of crop rectangle is positioned inside of the image's original bounding
        rectangle. - If the offset is negative or greater than 1, the corresponding edge of crop
        rectangle is positioned outside of the image's original bounding rectangle. - If all offsets
        and rotation angles are 0, the image is not cropped.
      properties:
        offsetLeft:
          type: number
          description: The offset specifies how far inwards the left edge of the crop rectangle is from the
            left edge of the original content as a fraction of the original content's width.
          format: float
        offsetTop:
          type: number
          description: The offset specifies how far inwards the top edge of the crop rectangle is from the top
            edge of the original content as a fraction of the original content's height.
          format: float
        offsetBottom:
          type: number
          description: The offset specifies how far inwards the bottom edge of the crop rectangle is from the
            bottom edge of the original content as a fraction of the original content's height.
          format: float
        offsetRight:
          type: number
          description: The offset specifies how far inwards the right edge of the crop rectangle is from the
            right edge of the original content as a fraction of the original content's width.
          format: float
        angle:
          description: The clockwise rotation angle of the crop rectangle around its center, in radians.
            Rotation is applied after the offsets.
          format: float
          type: number
    CropPropertiesSuggestionState:
      type: object
      description: A mask that indicates which of the fields on the base CropProperties have been changed
        in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        offsetLeftSuggested:
          description: Indicates if there was a suggested change to offset_left.
          type: boolean
        angleSuggested:
          type: boolean
          description: Indicates if there was a suggested change to angle.
        offsetRightSuggested:
          description: Indicates if there was a suggested change to offset_right.
          type: boolean
        offsetBottomSuggested:
          type: boolean
          description: Indicates if there was a suggested change to offset_bottom.
        offsetTopSuggested:
          description: Indicates if there was a suggested change to offset_top.
          type: boolean
    DateElement:
      description: A date instance mentioned in a document.
      properties:
        suggestedTextStyleChanges:
          description: The suggested text style changes to this DateElement, keyed by suggestion ID.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedTextStyle"
        dateId:
          description: Output only. The unique ID of this date.
          type: string
        textStyle:
          description: The text style of this DateElement.
          $ref: "#/components/schemas/TextStyle"
        dateElementProperties:
          description: The properties of this DateElement.
          $ref: "#/components/schemas/DateElementProperties"
        suggestedDateElementPropertiesChanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedDateElementProperties"
          description: The suggested changes to the date element properties, keyed by suggestion ID.
        suggestedInsertionIds:
          description: IDs for suggestions that insert this date into the document. A DateElement might have
            multiple insertion IDs if it's a nested suggested change (a suggestion within a
            suggestion made by a different user, for example). If empty, then this date isn't a
            suggested insertion.
          type: array
          items:
            type: string
        suggestedDeletionIds:
          items:
            type: string
          type: array
          description: IDs for suggestions that remove this date from the document. A DateElement might have
            multiple deletion IDs if, for example, multiple users suggest deleting it. If empty,
            then this date isn't suggested for deletion.
      type: object
    DateElementProperties:
      type: object
      description: Properties of a DateElement.
      properties:
        timestamp:
          type: string
          description: "The point in time to represent, in seconds and nanoseconds since Unix epoch: January
            1, 1970 at midnight UTC. Timestamp is expected to be in UTC. If time_zone_id is set, the
            timestamp is adjusted according to the time zone. For example, a timestamp of `18000`
            with a date format of `DATE_FORMAT_ISO8601` and time format of `TIME_FORMAT_HOUR_MINUTE`
            would be displayed as `1970-01-01 5:00 AM`. A timestamp of `18000` with date format of
            `DATE_FORMAT_ISO8601`, time format of `TIME_FORMAT_HOUR_MINUTE`, and time zone set to
            `America/New_York` will instead be `1970-01-01 12:00 AM`."
          format: google-datetime
        displayText:
          description: Output only. Indicates how the DateElement is displayed in the document.
          type: string
        locale:
          description: "The language code of the DateElement. For example, `en`. If unset, the default locale
            is `en`. Limited to the following locales: `af`, `am`, `ar`, `as`, `az`, `be`, `bg`,
            `bn`, `ca`, `cs`, `da`, `de`, `el`, `en`, `en-CA`, `en-GB`, `es`, `es-419`, `et`, `eu`,
            `fa`, `fi`, `fil`, `fr`, `fr-CA`, `gl`, `gu`, `hi`, `hr`, `hu`, `hy`, `id`, `is`, `it`,
            `iw`, `ja`, `ka`, `kk`, `km`, `kn`, `ko`, `lo`, `lt`, `lv`, `mk`, `ml`, `mn`, `mr`,
            `ms`, `ne`, `nl`, `no`, `or`, `pa`, `pl`, `pt-BR`, `pt-PT`, `ro`, `ru`, `si`, `sk`,
            `sl`, `sq`, `sr`, `sv`, `sw`, `ta`, `te`, `th`, `tr`, `uk`, `ur`, `uz`, `vi`, `zh-CN`,
            `zh-HK`, `zh-TW`, `zu`, `cy`, `my`."
          type: string
        dateFormat:
          type: string
          description: Determines how the date part of the DateElement will be displayed in the document. If
            unset, the default value is DATE_FORMAT_MONTH_DAY_YEAR_ABBREVIATED, indicating the
            DateElement will be formatted as `MMM d, y` in `en`, or locale specific equivalent.
          enum:
            - DATE_FORMAT_UNSPECIFIED
            - DATE_FORMAT_CUSTOM
            - DATE_FORMAT_MONTH_DAY_ABBREVIATED
            - DATE_FORMAT_MONTH_DAY_FULL
            - DATE_FORMAT_MONTH_DAY_YEAR_ABBREVIATED
            - DATE_FORMAT_ISO8601
          enumDescriptions:
            - The date format is unspecified.
            - Output only. The date format is imported from an external source.
            - The date format is an abbreviated month followed by the day. For example, "Jan 1".
            - The date format is a month followed by the day. For example, "January 01".
            - The date format is an abbreviated month followed by the day and the year. For example,
              "Jan 1, 1970".
            - The date format is in ISO 8601 format. For example, "1970-01-01".
        timeZoneId:
          type: string
          description: The time zone of the DateElement, as defined by the Unicode Common Locale Data
            Repository (CLDR) project. For example, `America/New_York`. If unset, the default time
            zone is `etc/UTC`.
        timeFormat:
          enumDescriptions:
            - The time format is unspecified.
            - Indicates that the date does not have a time.
            - The time format shows the hour and minute. For example, "Jan 1, 1970 12:00 PM".
            - The time format shows the hour, minute, and timezone. For example, "Jan 1, 1970 12:00
              PM UTC".
          type: string
          description: Determines how the time part of the DateElement will be displayed in the document. If
            unset, the default value is TIME_FORMAT_DISABLED, indicating no time should be shown.
          enum:
            - TIME_FORMAT_UNSPECIFIED
            - TIME_FORMAT_DISABLED
            - TIME_FORMAT_HOUR_MINUTE
            - TIME_FORMAT_HOUR_MINUTE_TIMEZONE
    DateElementPropertiesSuggestionState:
      description: A mask that indicates which of the fields on the base DateElementProperties have been
        changed in this suggestion. For any field set to true, there's a new suggested value.
      properties:
        timestampSuggested:
          description: Indicates if there was a suggested change to timestamp.
          type: boolean
        dateFormatSuggested:
          description: Indicates if there was a suggested change to date_format.
          type: boolean
        timeZoneIdSuggested:
          type: boolean
          description: Indicates if there was a suggested change to time_zone_id.
        localeSuggested:
          type: boolean
          description: Indicates if there was a suggested change to locale.
        timeFormatSuggested:
          type: boolean
          description: Indicates if there was a suggested change to time_format.
      type: object
    Dimension:
      type: object
      description: A magnitude in a single direction in the specified units.
      properties:
        unit:
          enumDescriptions:
            - The units are unknown.
            - A point, 1/72 of an inch.
          type: string
          description: The units for magnitude.
          enum:
            - UNIT_UNSPECIFIED
            - PT
        magnitude:
          type: number
          description: The magnitude.
          format: double
    Document:
      type: object
      description: A Google Docs document.
      properties:
        tabs:
          description: Tabs that are part of a document. Tabs can contain child tabs, a tab nested within
            another tab. Child tabs are represented by the Tab.childTabs field.
          type: array
          items:
            $ref: "#/components/schemas/Tab"
        suggestionsViewMode:
          enumDescriptions:
            - The SuggestionsViewMode applied to the returned document depends on the user's current
              access level. If the user only has view access, PREVIEW_WITHOUT_SUGGESTIONS is
              applied. Otherwise, SUGGESTIONS_INLINE is applied. This is the default suggestions
              view mode.
            - The returned document has suggestions inline. Suggested changes will be differentiated
              from base content within the document. Requests to retrieve a document using this mode
              will return a 403 error if the user does not have permission to view suggested
              changes.
            - The returned document is a preview with all suggested changes accepted. Requests to
              retrieve a document using this mode will return a 403 error if the user does not have
              permission to view suggested changes.
            - The returned document is a preview with all suggested changes rejected if there are
              any suggestions in the document.
          description: "Output only. The suggestions view mode applied to the document. Note: When editing a
            document, changes must be based on a document with SUGGESTIONS_INLINE."
          enum:
            - DEFAULT_FOR_CURRENT_ACCESS
            - SUGGESTIONS_INLINE
            - PREVIEW_SUGGESTIONS_ACCEPTED
            - PREVIEW_WITHOUT_SUGGESTIONS
          type: string
        body:
          description: "Output only. The main body of the document. Legacy field: Instead, use
            Document.tabs.documentTab.body, which exposes the actual document content from all tabs
            when the includeTabsContent parameter is set to `true`. If `false` or unset, this field
            contains information about the first tab in the document."
          $ref: "#/components/schemas/Body"
        namedStyles:
          description: "Output only. The named styles of the document. Legacy field: Instead, use
            Document.tabs.documentTab.namedStyles, which exposes the actual document content from
            all tabs when the includeTabsContent parameter is set to `true`. If `false` or unset,
            this field contains information about the first tab in the document."
          $ref: "#/components/schemas/NamedStyles"
        namedRanges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NamedRanges"
          description: "Output only. The named ranges in the document, keyed by name. Legacy field: Instead,
            use Document.tabs.documentTab.namedRanges, which exposes the actual document content
            from all tabs when the includeTabsContent parameter is set to `true`. If `false` or
            unset, this field contains information about the first tab in the document."
        headers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Header"
          description: "Output only. The headers in the document, keyed by header ID. Legacy field: Instead,
            use Document.tabs.documentTab.headers, which exposes the actual document content from
            all tabs when the includeTabsContent parameter is set to `true`. If `false` or unset,
            this field contains information about the first tab in the document."
        suggestedNamedStylesChanges:
          description: "Output only. The suggested changes to the named styles of the document, keyed by
            suggestion ID. Legacy field: Instead, use
            Document.tabs.documentTab.suggestedNamedStylesChanges, which exposes the actual document
            content from all tabs when the includeTabsContent parameter is set to `true`. If `false`
            or unset, this field contains information about the first tab in the document."
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedNamedStyles"
        title:
          description: The title of the document.
          type: string
        documentId:
          type: string
          description: Output only. The ID of the document.
        documentStyle:
          description: "Output only. The style of the document. Legacy field: Instead, use
            Document.tabs.documentTab.documentStyle, which exposes the actual document content from
            all tabs when the includeTabsContent parameter is set to `true`. If `false` or unset,
            this field contains information about the first tab in the document."
          $ref: "#/components/schemas/DocumentStyle"
        suggestedDocumentStyleChanges:
          description: "Output only. The suggested changes to the style of the document, keyed by suggestion
            ID. Legacy field: Instead, use Document.tabs.documentTab.suggestedDocumentStyleChanges,
            which exposes the actual document content from all tabs when the includeTabsContent
            parameter is set to `true`. If `false` or unset, this field contains information about
            the first tab in the document."
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SuggestedDocumentStyle"
        positionedObjects:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PositionedObject"
          description: "Output only. The positioned objects in the document, keyed by object ID. Legacy field:
            Instead, use Document.tabs.documentTab.positionedObjects, which exposes the actual
            document content from all tabs when the includeTabsContent parameter is set to `true`.
            If `false` or unset, this field contains information about the first tab in the
            document."
        inlineObjects:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/InlineObject"
          description: "Output only. The inline objects in the document, keyed by object ID. Legacy field:
            Instead, use Document.tabs.documentTab.inlineObjects, which exposes the actual document
            content from all tabs when the includeTabsContent parameter is set to `true`. If `false`
            or unset, this field contains information about the first tab in the document."
        lists:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/List"
          description: "Output only. The lists in the document, keyed by list ID. Legacy field: Instead, use
            Document.tabs.documentTab.lists, which exposes the actual document content from all tabs
            when the includeTabsContent parameter is set to `true`. If `false` or unset, this field
            contains information about the first tab in the document."
        footers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Footer"
          description: "Output only. The footers in the document, keyed by footer ID. Legacy field: Instead,
            use Document.tabs.documentTab.footers, which exposes the actual document content from
            all tabs when the includeTabsContent parameter is set to `true`. If `false` or unset,
            this field contains information about the first tab in the document."
        footnotes:
          description: "Output only. The footnotes in the document, keyed by footnote ID. Legacy field:
            Instead, use Document.tabs.documentTab.footnotes, which exposes the actual document
            content from all tabs when the includeTabsContent parameter is set to `true`. If `false`
            or unset, this field contains information about the first tab in the document."
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Footnote"
        revisionId:
          type: string
          description: Output only. The revision ID of the document. Can be used in update requests to specify
            which revision of a document to apply updates to and how the request should behave if
            the document has been edited since that revision. Only populated if the user has edit
            access to the document. The revision ID is not a sequential number but an opaque string.
            The format of the revision ID might change over time. A returned revision ID is only
            guaranteed to be valid for 24 hours after it has been returned and cannot be shared
            across users. If the revision ID is unchanged between calls, then the document has not
            changed. Conversely, a changed ID (for the same document and user) usually means the
            document has been updated. However, a changed ID can also be due to internal factors
            such as ID format changes.
    DocumentFormat:
      description: Represents document-level format settings.
      properties:
        documentMode:
          enumDescriptions:
            - The document mode is unspecified.
            - The document has pages.
            - The document is pageless.
          type: string
          description: Whether the document has pages or is pageless.
          enum:
            - DOCUMENT_MODE_UNSPECIFIED
            - PAGES
            - PAGELESS
      type: object
    DocumentStyle:
      type: object
      description: The style of the document.
      properties:
        background:
          description: The background of the document. Documents cannot have a transparent background color.
          $ref: "#/components/schemas/Background"
        defaultFooterId:
          type: string
          description: The ID of the default footer. If not set, there's no default footer. If DocumentMode is
            PAGELESS, this property will not be rendered. This property is read-only.
        firstPageFooterId:
          type: string
          description: The ID of the footer used only for the first page. If not set then a unique footer for
            the first page does not exist. The value of use_first_page_header_footer determines
            whether to use the default_footer_id or this value for the footer on the first page. If
            not set, there's no first page footer. If DocumentMode is PAGELESS, this property will
            not be rendered. This property is read-only.
        useEvenPageHeaderFooter:
          description: Indicates whether to use the even page header / footer IDs for the even pages. If
            DocumentMode is PAGELESS, this property will not be rendered.
          type: boolean
        useCustomHeaderFooterMargins:
          description: Indicates whether DocumentStyle margin_header, SectionStyle margin_header and
            DocumentStyle margin_footer, SectionStyle margin_footer are respected. When false, the
            default values in the Docs editor for header and footer margin is used. If DocumentMode
            is PAGELESS, this property will not be rendered. This property is read-only.
          type: boolean
        firstPageHeaderId:
          type: string
          description: The ID of the header used only for the first page. If not set then a unique header for
            the first page does not exist. The value of use_first_page_header_footer determines
            whether to use the default_header_id or this value for the header on the first page. If
            not set, there's no first page header. If DocumentMode is PAGELESS, this property will
            not be rendered. This property is read-only.
        documentFormat:
          description: Specifies document-level format settings, such as the document mode (pages vs pageless).
          $ref: "#/components/schemas/DocumentFormat"
        evenPageFooterId:
          type: string
          description: The ID of the footer used only for even pages. The value of use_even_page_header_footer
            determines whether to use the default_footer_id or this value for the footer on even
            pages. If not set, there's no even page footer. If DocumentMode is PAGELESS, this
            property will not be rendered. This property is read-only.
        marginFooter:
          description: The amount of space between the bottom of the page and the contents of the footer. If
            DocumentMode is PAGELESS, this property will not be rendered.
          $ref: "#/components/schemas/Dimension"
        marginTop:
          description: The top page margin. Updating the top page margin on the document style clears the top
            page margin on all section styles. If DocumentMode is PAGELESS, this property will not
            be rendered.
          $ref: "#/components/schemas/Dimension"
        marginLeft:
          description: The left page margin. Updating the left page margin on the document style clears the
            left page margin on all section styles. It may also cause columns to resize in all
            sections. If DocumentMode is PAGELESS, this property will not be rendered.
          $ref: "#/components/schemas/Dimension"
        marginHeader:
          description: The amount of space between the top of the page and the contents of the header. If
            DocumentMode is PAGELESS, this property will not be rendered.
          $ref: "#/components/schemas/Dimension"
        useFirstPageHeaderFooter:
          type: boolean
          description: Indicates whether to use the first page header / footer IDs for the first page. If
            DocumentMode is PAGELESS, this property will not be rendered.
        pageNumberStart:
          description: The page number from which to start counting the number of pages. If DocumentMode is
            PAGELESS, this property will not be rendered.
          format: int32
          type: integer
        marginBottom:
          description: The bottom page margin. Updating the bottom page margin on the document style clears
            the bottom page margin on all section styles. If DocumentMode is PAGELESS, this property
            will not be rendered.
          $ref: "#/components/schemas/Dimension"
        marginRight:
          description: The right page margin. Updating the right page margin on the document style clears the
            right page margin on all section styles. It may also cause columns to resize in all
            sections. If DocumentMode is PAGELESS, this property will not be rendered.
          $ref: "#/components/schemas/Dimension"
        pageSize:
          description: The size of a page in the document. If DocumentMode is PAGELESS, this property will not
            be rendered.
          $ref: "#/components/schemas/Size"
        defaultHeaderId:
          type: string
          description: The ID of the default header. If not set, there's no default header. If DocumentMode is
            PAGELESS, this property will not be rendered. This property is read-only.
        evenPageHeaderId:
          type: string
          description: The ID of the header used only for even pages. The value of use_even_page_header_footer
            determines whether to use the default_header_id or this value for the header on even
            pages. If not set, there's no even page header. If DocumentMode is PAGELESS, this
            property will not be rendered. This property is read-only.
        flipPageOrientation:
          description: Optional. Indicates whether to flip the dimensions of the page_size, which allows
            changing the page orientation between portrait and landscape. If DocumentMode is
            PAGELESS, this property will not be rendered.
          type: boolean
    DocumentStyleSuggestionState:

        embeddedObjectBorder:
          description: The border of the embedded object.
          $ref: "#/components/schemas/EmbeddedObjectBorder"
      type: object
    EmbeddedObjectBorder:
      type: object
      description: A border around an EmbeddedObject.
      properties:
        color:
          description: The color of the border.
          $ref: "#/components/schemas/OptionalColor"
        width:
          description: The width of the border.
          $ref: "#/components/schemas/Dimension"
        dashStyle:
          enumDescriptions:
            - Unspecified dash style.
            - Solid line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'solid'. This is the
              default dash style.
            - Dotted line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dot'.
            - Dashed line. Corresponds to ECMA-376 ST_PresetLineDashVal value 'dash'.
          description: The dash style of the border.
          enum:
            - DASH_STYLE_UNSPECIFIED
            - SOLID
            - DOT
            - DASH
          type: string
        propertyState:
          type: string
          description: The property state of the border property.
          enum:
            - RENDERED
            - NOT_RENDERED
          enumDescriptions:
            - If a property's state is RENDERED, then the element has the corresponding property
              when rendered in the document. This is the default value.
            - If a property's state is NOT_RENDERED, then the element does not have the
              corresponding property when rendered in the document.
    EmbeddedObjectBorderSuggestionState:

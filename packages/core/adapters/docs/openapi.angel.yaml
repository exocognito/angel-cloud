        sourceUri:
          type: string
          description: The source URI is the URI used to insert the image. The source URI can be empty.
        brightness:
          type: number
          description: The brightness effect of the image. The value should be in the interval [-1.0, 1.0],
            where 0 means no effect.
          format: float
        cropProperties:
          description: The crop properties of the image.
